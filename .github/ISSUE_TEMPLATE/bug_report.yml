name: Bug Report
description: Report a bug to help us improve
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
        Please search existing issues before filing a new one.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "When I run `sdlc design ...`, the skill produces ..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. In project X, trigger `sdlc design`
        2. Skill loads references/design.md and ...
        3. See unexpected output
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: "The skill should produce a design doc that ..."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: "The skill loaded the wrong template / skipped a section / ..."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Output
      description: |
        Paste any relevant output from the skill (produced doc snippet, error text).
        This will be automatically formatted into code, so no backticks needed.
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Please provide your environment details.
      value: |
        - Skill version / commit:
        - Claude Code version:
        - Install level (user `~/.claude/skills/` or project `.claude/skills/`):
        - Project type (backend / frontend / cli-library / other):
        - OS:
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Context
      description: |
        Which subcommand/stage, any overlay enabled, and relevant `.sdlc/` artifact paths.
      render: yaml

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight Checks
      options:
        - label: I have searched existing issues and confirmed this is not a duplicate
          required: true
        - label: I am using the latest version of the skill
          required: false
