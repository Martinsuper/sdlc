name: Feature Request
description: Suggest an idea for SDLC
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature!
        Please search existing issues before filing a new one.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: |
        Is your feature request related to a problem? Please describe.
        Ex. I'm always frustrated when [...]
      placeholder: "I need to be able to ... but currently SDLC doesn't support ..."
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Describe the specific use case this feature would enable.
      placeholder: "When working on project X, I want to ... so that ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see.
      placeholder: "Add a new command `sdlc ...` that ..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: |
        A clear description of any alternative solutions or features you've considered.
      placeholder: "I considered using `sdlc run --profile ...` but it doesn't cover ..."

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      description: Which part of SDLC does this relate to?
      options:
        - CLI commands
        - Pipeline execution
        - Adapters
        - Rule engine
        - Quality gates
        - LLM integration
        - Knowledge base
        - Configuration
        - Python API (SdlcClient)
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or screenshots about the feature request here.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight Checks
      options:
        - label: I have searched existing issues and confirmed this is not a duplicate
          required: true
        - label: I have checked the documentation and this feature is not already available
          required: true
