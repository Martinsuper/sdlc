name: Question
description: Ask a question about sdlc skill usage
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Have a question about the sdlc skill?
        Before asking, please check the [README](../../README.md), the
        [Contributing Guide](../../CONTRIBUTING.md), and existing issues.

  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: What would you like to know?
      placeholder: "How do I enable the enterprise overlay for the design stage?"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: |
        Any relevant context about your setup or what you've already tried.
      placeholder: |
        - Install level (user `~/.claude/skills/` or project `.claude/skills/`)
        - Which subcommand/stage I triggered
        - What the skill produced vs. what I expected

  - type: dropdown
    id: area
    attributes:
      label: Related Area
      description: Which part of the skill does your question relate to?
      options:
        - Installation / Setup
        - Subcommand usage
        - Stage prompts (references/)
        - Project profile detection
        - Artifact templates
        - Checklist / review dimensions
        - Enterprise overlay
        - Other
    validations:
      required: true

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight Checks
      options:
        - label: I have searched existing issues and discussions for an answer
          required: true
        - label: I have read the README and Contributing Guide
          required: true
