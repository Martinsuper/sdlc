[project]
name = "sdlc"
version = "1.1.0"
description = "AI-driven full-lifecycle SDLC orchestration CLI tool"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "sdlc team" }]
keywords = ["sdlc", "ai", "cli", "orchestration"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "pydantic>=2.6",
    "ruamel.yaml>=0.18",
    "jinja2>=3.1",
    "httpx>=0.27",
    "anthropic>=0.34",
    "openai>=1.30",
]

[project.urls]
Homepage = "https://github.com/your-org/sdlc"
Documentation = "https://your-org.github.io/sdlc/"
Repository = "https://github.com/your-org/sdlc"
Issues = "https://github.com/your-org/sdlc/issues"
Changelog = "https://github.com/your-org/sdlc/blob/main/CHANGELOG.md"

[project.optional-dependencies]
semantic = [
    "sqlite-vec>=0.1",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "freezegun>=1.5",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "bandit>=1.8",
    "pip-audit>=2.7",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "locust>=2.29",
]

[project.scripts]
sdlc = "sdlc.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["sdlc", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "RUF"]
# RUF001/002/003: fullwidth CJK punctuation in Chinese prompt templates and
# comments is intentional, not ambiguous — the project is Chinese-first.
ignore = ["E501", "A002", "A005", "RUF012", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["sdlc"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "smoke: end-to-end main-path smoke gate (M-D1); profile-completion tests need a reachable model",
]

[tool.hatch.build.targets.wheel]
packages = ["sdlc"]
