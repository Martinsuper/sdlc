[project]
name = "sdlc"
version = "0.3.0"
description = "AI-driven full-lifecycle SDLC orchestration CLI tool"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "sdlc team" }]
keywords = ["sdlc", "ai", "cli", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "pydantic>=2.6",
    "ruamel.yaml>=0.18",
    "jinja2>=3.1",
    "httpx>=0.27",
    "anthropic>=0.34",
    "openai>=1.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "freezegun>=1.5",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "bandit>=1.8",
    "pip-audit>=2.7",
]

[project.scripts]
sdlc = "sdlc.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["sdlc", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "RUF"]
ignore = ["E501", "A002", "A005", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["sdlc"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["sdlc"]
