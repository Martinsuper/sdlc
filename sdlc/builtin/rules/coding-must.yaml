- id: coding-no-sleep-in-test
  level: SHOULD
  category: testing
  description: "测试代码中避免使用 sleep 等待"
  enforcer: cr
  pattern: "(Thread\\.sleep|time\\.sleep|setTimeout)\\s*\\(.*\\d{3,}"
  message: "测试中应使用条件等待而非固定延迟，避免测试不稳定"
  action: warn
  severity: P2
  applies_to: ["**/*test*.py", "**/*test*.js", "**/*test*.ts", "**/*Test*.java", "**/*_test.go"]
  references: []

- id: coding-no-flaky-test-random
  level: SHOULD
  category: testing
  description: "测试不应依赖随机数据或时间"
  enforcer: cr
  pattern: "(Math\\.random|random\\.random|rand\\.Int|Date\\.now|time\\.time|datetime\\.now)\\(\\)"
