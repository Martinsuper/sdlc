  action: warn
  severity: P2
  applies_to: ["**/*.py", "**/*.js", "**/*.ts", "**/*.java", "**/*.go"]
  references: []

- id: coding-no-hardcoded-config
  level: SHOULD
  category: coding
  description: "配置值不应硬编码在源码中"
  enforcer: cr
  pattern: "(host|port|timeout|retry|pool_size|buffer_size|batch_size)\\s*=\\s*\\d+"
