  references: []

- id: coding-no-return-early-missing
  level: SHOULD
  category: coding
  description: "优先使用卫语句提前返回，减少嵌套"
  enforcer: cr
  pattern: "if\\s*\\([^)]*\\)\\s*\\{[^}]*if\\s*\\([^)]*\\)\\s*\\{"
