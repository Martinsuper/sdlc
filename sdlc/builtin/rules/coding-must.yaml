- id: coding-no-missing-error-context
  level: SHOULD
  category: error-handling
  description: "错误信息应包含足够的上下文"
  enforcer: cr
  pattern: "(raise|throw)\\s+\\w+Error\\s*\\(\\s*[\"'](?:failed|error|invalid)\\s*[\"']\\s*\\)"
