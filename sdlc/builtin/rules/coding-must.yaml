- id: no-thread-sleep
  level: MUST
  category: coding
  description: "禁止使用 Thread.sleep 阻塞主线程"
  enforcer: cr
  pattern: "Thread\\.sleep"
  message: "禁止使用 Thread.sleep；请用调度器"
  action: block
  severity: P1
  applies_to: ["**/*.java"]
  references: []

- id: no-system-out
  level: SHOULD
  category: logging
  description: "禁止使用 System.out，应使用日志框架"
  enforcer: cr
  pattern: "System\\.(out|err)\\.print"
  message: "请使用日志框架而非 System.out/err"
  action: warn
  severity: P2
  applies_to: ["**/*.java"]
  references: []

- id: no-hardcoded-secrets
  level: MUST
  category: security
  description: "禁止硬编码密钥和密码"
  enforcer: cr
  pattern: "(password|secret|api_key|apikey)\\s*=\\s*[\"'][^\"']+[\"']"
  message: "检测到硬编码密钥，请使用环境变量或配置中心"
  action: block
  severity: P0
  applies_to: ["**/*.java", "**/*.py", "**/*.js", "**/*.ts", "**/*.go"]
  references: []

- id: no-todo-in-prod
  level: SHOULD
  category: quality
  description: "生产代码中不应遗留 TODO/FIXME/HACK 注释"
  enforcer: cr
  pattern: "(TODO|FIXME|HACK|XXX)[\\s:]"
  message: "请清理生产代码中的 TODO/FIXME/HACK 注释"
  action: warn
  severity: P3
  applies_to: ["**/*.java", "**/*.py", "**/*.js", "**/*.ts", "**/*.go", "**/*.rs"]
  references: []

- id: no-debug-code
  level: MUST
  category: quality
  description: "禁止提交调试代码（debugger/breakpoint/pylint disable）"
  enforcer: cr
  pattern: "(debugger\\s*;|breakpoint\\(\\)|#\\s*pylint:\\s*disable=)"
  message: "禁止提交调试代码，请移除 debugger/breakpoint/pylint disable"
  action: block
  severity: P1
  applies_to: ["**/*.java", "**/*.py", "**/*.js", "**/*.ts", "**/*.go"]
  references: []

- id: no-empty-catch
  level: MUST
  category: error-handling
  description: "禁止空的 catch/except 块"
  enforcer: cr
  pattern: "(catch\\s*\\([^)]*\\)\\s*\\{\\s*\\}|except\\s+\\w+\\s*:\\s*pass)"
  message: "空的 catch/except 块会吞没异常，请至少记录日志"
  action: block
  severity: P1
  applies_to: ["**/*.java", "**/*.py", "**/*.js", "**/*.ts", "**/*.go"]
  references: []

- id: no-magic-numbers
  level: SHOULD
  category: coding
  description: "禁止在代码中使用未命名的魔法数字"
  enforcer: cr
  pattern: "(?<![\\w.])\\d{2,}(?![\\w.])"
  message: "请将魔法数字提取为命名常量"
  action: warn
  severity: P3
  applies_to: ["**/*.java", "**/*.py", "**/*.js", "**/*.ts", "**/*.go"]
  references: []

- id: no-long-methods
  level: SHOULD
  category: design
  description: "方法体不应过长，建议不超过80行"
  enforcer: cr
  pattern: "(def|function|public|private|protected)\\s+\\w+\\s*\\("
  message: "方法体过长，建议拆分为更小的函数"
  action: warn
  severity: P3
  applies_to: ["**/*.java", "**/*.py", "**/*.js", "**/*.ts", "**/*.go"]
  references: []

- id: no-deep-nesting
  level: SHOULD
  category: design
  description: "禁止过深的嵌套层级（建议不超过4层）"
  enforcer: cr
  pattern: "(if|for|while|switch|try)\\s*[\\(\\{]"
  message: "嵌套层级过深，建议使用卫语句或提取子函数"
  action: warn
  severity: P2
  applies_to: ["**/*.java", "**/*.py", "**/*.js", "**/*.ts", "**/*.go"]
  references: []

- id: no-duplicate-code
  level: SHOULD
  category: quality
  description: "禁止重复代码块"
  enforcer: cr
  pattern: "(copy|paste|duplicate)\\s*-\\s*(code|block)"
  message: "检测到疑似重复代码，请提取公共方法"
  action: warn
  severity: P2
  applies_to: ["**/*.java", "**/*.py", "**/*.js", "**/*.ts", "**/*.go"]
  references: []

- id: no-global-state
  level: SHOULD
  category: design
  description: "避免使用全局可变状态"
  enforcer: cr
  pattern: "(global\\s+\\w+|window\\.\\w+\\s*=|process\\.\\w+\\s*=)"
  message: "避免使用全局可变状态，请考虑依赖注入"
  action: warn
  severity: P2
  applies_to: ["**/*.py", "**/*.js", "**/*.ts"]
  references: []

- id: no-mutable-defaults
  level: MUST
  category: coding
  description: "禁止使用可变对象作为默认值"
  enforcer: cr
  pattern: "(=\\s*\\[\\s*\\]|=\\s*\\{\\s*\\}|=\\s*set\\(\\))"
  message: "不要使用可变对象作为默认值，请使用 None 或不可变对象"
  action: block
  severity: P1
  applies_to: ["**/*.py", "**/*.js", "**/*.ts"]
  references: []

- id: no-eval-exec
  level: MUST
  category: security
  description: "禁止使用 eval/exec 类函数"
  enforcer: cr
  pattern: "(\\beval\\s*\\(|\\bexec\\s*\\(|new\\s+Function\\s*\\()"
  message: "eval/exec 存在代码注入风险，请使用安全替代方案"
  action: block
  severity: P0
  applies_to: ["**/*.py", "**/*.js", "**/*.ts", "**/*.java"]
  references: []

- id: no-sql-injection
  level: MUST
  category: security
  description: "禁止字符串拼接构造 SQL 语句"
  enforcer: cr
  pattern: "(SELECT|INSERT|UPDATE|DELETE|DROP).*\\+.*|(SELECT|INSERT|UPDATE|DELETE|DROP).*%[sd].*|f\".*SELECT|f\".*INSERT|f\".*UPDATE|f\".*DELETE"
  message: "检测到可能的 SQL 注入，请使用参数化查询"
  action: block
  severity: P0
  applies_to: ["**/*.py", "**/*.js", "**/*.ts", "**/*.java", "**/*.go"]
  references: []

- id: no-path-traversal
  level: MUST
  category: security
  description: "禁止未经验证的用户输入用于文件路径"
  enforcer: cr
  pattern: "(open\\(.*\\+|readFile\\(.*\\+|writeFile\\(.*\\+|os\\.path\\.join\\(.*request)"
  message: "文件路径中可能包含用户输入，请进行路径验证和规范化"
  action: block
  severity: P0
  applies_to: ["**/*.py", "**/*.js", "**/*.ts", "**/*.java", "**/*.go"]
  references: []

- id: no-unsafe-deserialization
  level: MUST
  category: security
  description: "禁止使用不安全的反序列化方法"
  enforcer: cr
  pattern: "(pickle\\.loads?\\(|yaml\\.load\\((?!Loader)|ObjectInputStream|unserialize\\()"
  message: "不安全的反序列化可能导致远程代码执行，请使用安全替代方案"
  action: block
  severity: P0
  applies_to: ["**/*.py", "**/*.js", "**/*.ts", "**/*.java"]
  references: []

- id: no-weak-crypto
  level: MUST
  category: security
  description: "禁止使用弱加密算法"
  enforcer: cr
  pattern: "(MD5|SHA1|DES|RC4|Blowfish|hashlib\\.md5|hashlib\\.sha1|MessageDigest\\.getInstance\\s*\\(\\s*\"MD5\")"
  message: "检测到弱加密算法，请使用 SHA-256/AES-256 等强加密算法"
  action: block
  severity: P0
  applies_to: ["**/*.py", "**/*.js", "**/*.ts", "**/*.java", "**/*.go"]
  references: []

- id: no-plain-http
  level: MUST
  category: security
  description: "禁止使用不加密的 HTTP 连接传输敏感数据"
  enforcer: cr
  pattern: "http://(?!localhost|127\\.0\\.0\\.1|0\\.0\\.0\\.0)"
  message: "禁止使用明文 HTTP，请使用 HTTPS"
  action: block
  severity: P0
  applies_to: ["**/*.py", "**/*.js", "**/*.ts", "**/*.java", "**/*.go"]
  references: []

- id: no-missing-input-validation
  level: MUST
  category: security
  description: "外部输入必须进行验证"
  enforcer: cr
  pattern: "(request\\.(body|params|query|headers)\\[|req\\.(body|params|query)\\[|@RequestParam|@PathVariable)"
  message: "外部输入必须进行验证和清洗"
  action: warn
  severity: P1
  applies_to: ["**/*.py", "**/*.js", "**/*.ts", "**/*.java", "**/*.go"]
  references: []

- id: no-missing-error-handling
  level: MUST
  category: error-handling
  description: "关键操作必须有错误处理"
  enforcer: cr
  pattern: "(fetch\\(|axios\\.|http\\.get|http\\.post|requests\\.(get|post))\\("
  message: "网络请求等关键操作必须有错误处理"
  action: warn
  severity: P1
  applies_to: ["**/*.py", "**/*.js", "**/*.ts", "**/*.java", "**/*.go"]
  references: []

- id: no-unused-imports
  level: SHOULD
  category: quality
  description: "禁止未使用的导入"
  enforcer: cr
  pattern: "^import\\s+|^from\\s+"
  message: "检测到未使用的导入，请移除"
  action: warn
  severity: P3
  applies_to: ["**/*.py", "**/*.js", "**/*.ts", "**/*.java", "**/*.go"]
  references: []

- id: no-broad-exception
  level: SHOULD
  category: error-handling
  description: "避免捕获过于宽泛的异常类型"
  enforcer: cr
  pattern: "(catch\\s*\\(\\s*Exception|except\\s+Exception|except\\s+BaseException)"
  message: "请捕获具体的异常类型，不要使用 Exception 或 BaseException"
  action: warn
  severity: P2
  applies_to: ["**/*.java", "**/*.py", "**/*.js", "**/*.ts", "**/*.go"]
  references: []

- id: no-string-concat-sql
  level: MUST
  category: security
  description: "禁止通过字符串拼接构建 SQL 查询"
  enforcer: cr
  pattern: "\"\\s*\\+\\s*.*\\+\\s*\"|'%s'\\s*%|\\.format\\(.*SELECT|\\.format\\(.*INSERT|\\.format\\(.*UPDATE|\\.format\\(.*DELETE"
  message: "请使用参数化查询代替字符串拼接 SQL"
  action: block
  severity: P0
  applies_to: ["**/*.py", "**/*.js", "**/*.ts", "**/*.java"]
  references: []

- id: no-unsafe-redirect
  level: MUST
  category: security
  description: "禁止未经验证的重定向"
  enforcer: cr
  pattern: "(redirect\\(.*request|sendRedirect\\(.*request|res\\.redirect\\(.*req\\.)"
  message: "重定向目标必须验证，防止开放重定向攻击"
  action: block
  severity: P1
  applies_to: ["**/*.py", "**/*.js", "**/*.ts", "**/*.java"]
  references: []

- id: no-logging-sensitive-data
  level: MUST
  category: security
  description: "禁止在日志中记录敏感数据"
  enforcer: cr
  pattern: "(log|logger|logging|console\\.log|print)\\(.*(password|token|secret|credit_card|ssn|social_security)"
  message: "禁止在日志中记录密码、令牌等敏感信息"
  action: block
  severity: P0
  applies_to: ["**/*.py", "**/*.js", "**/*.ts", "**/*.java", "**/*.go"]
  references: []

- id: coding-no-single-letter-name
  level: SHOULD
  category: naming
  description: "禁止使用单字母变量名（循环变量除外）"
  enforcer: cr
  pattern: "(var|let|const|int|long|string)\\s+[b-df-hj-np-z]\\s*[=;]"
  message: "变量名应具有描述性，避免使用单字母命名"
  action: warn
  severity: P3
  applies_to: ["**/*.py", "**/*.js", "**/*.ts", "**/*.java", "**/*.go"]
  references: []

- id: coding-no-abbreviated-name
  level: SHOULD
  category: naming
  description: "避免使用不常见的缩写作为标识符名"
  enforcer: cr
  pattern: "\\b(btn|mgr|svc|ctrl|dto|dao|repo|util|helper|handler|processor)\\b"
  message: "标识符名应使用完整单词，避免歧义缩写"
  action: warn
  severity: P3
  applies_to: ["**/*.py", "**/*.js", "**/*.ts", "**/*.java", "**/*.go"]
  references: []

- id: coding-no-misleading-boolean-name
  level: SHOULD
  category: naming
  description: "布尔变量名应以 is/has/can/should 等前缀开头"
  enforcer: cr
  pattern: "(bool|boolean)\\s+(?!is|has|can|should|will|was|did|allow|enable|support|need|has)[a-z]\\w+\\s*="
  message: "布尔变量名应使用 is/has/can/should 等前缀明确语义"
  action: warn
  severity: P3
  applies_to: ["**/*.py", "**/*.js", "**/*.ts", "**/*.java", "**/*.go"]
  references: []

- id: coding-no-god-class
  level: SHOULD
  category: design
  description: "类不应承担过多职责（上帝类反模式）"
  enforcer: cr
  pattern: "class\\s+\\w+(Manager|Handler|Util|Helper|Service|Controller)"
  message: "类职责过多，请按单一职责原则拆分"
  action: warn
  severity: P2
  applies_to: ["**/*.py", "**/*.js", "**/*.ts", "**/*.java", "**/*.go"]
  references: []

- id: coding-no-circular-dependency
  level: MUST
  category: design
  description: "禁止模块间循环依赖"
  enforcer: cr
  pattern: "import.*from\\s+['\"]\\.\\./.*import.*from\\s+['\"]\\./"
  message: "检测到可能的循环依赖，请重构模块关系"
  action: block
  severity: P1
  applies_to: ["**/*.py", "**/*.js", "**/*.ts", "**/*.java", "**/*.go"]
  references: []

- id: coding-no-deep-inheritance
  level: SHOULD
  category: design
  description: "继承层级不应超过3层"
  enforcer: cr
  pattern: "extends\\s+\\w+\\s+extends\\s+\\w+"
  message: "继承层级过深会增加耦合度，请使用组合代替继承"
  action: warn
  severity: P2
  applies_to: ["**/*.java", "**/*.py", "**/*.ts"]
  references: []

- id: coding-no-pinned-dependency
  level: SHOULD
  category: dependency
  description: "依赖版本应使用范围约束而非固定版本"
  enforcer: cr
  pattern: "\"[\\^~]?\\d+\\.\\d+\\.\\d+\""
  message: "建议使用语义化版本范围而非固定版本号"
  action: warn
  severity: P2
  applies_to: ["**/package.json", "**/requirements.txt", "**/go.mod", "**/Cargo.toml"]
  references: []

- id: coding-no-deprecated-api
  level: MUST
  category: dependency
  description: "禁止使用已废弃的 API"
  enforcer: cr
  pattern: "@Deprecated|@deprecated|deprecated\\s*\\("
  message: "检测到使用已废弃的 API，请迁移到推荐替代方案"
  action: warn
  severity: P1
  applies_to: ["**/*.py", "**/*.js", "**/*.ts", "**/*.java", "**/*.go"]
  references: []

- id: coding-no-unpinned-gh-action
  level: MUST
  category: dependency
  description: "GitHub Actions 必须使用 SHA 引用而非标签"
  enforcer: cr
  pattern: "uses\\s*:\\s*[\\w-]+/[\\w-]+@v\\d+"
  message: "GitHub Actions 应使用 commit SHA 而非标签以防止供应链攻击"
  action: warn
  severity: P1
  applies_to: ["**/*.yaml", "**/*.yml"]
  references: []

- id: coding-api-no-200-for-error
  level: MUST
  category: api
  description: "API 不应使用 200 状态码返回错误信息"
  enforcer: cr
  pattern: "status\\s*[:=]\\s*200.*error|statusCode\\s*[:=]\\s*200.*error"
  message: "错误响应应使用正确的 HTTP 状态码，不应返回 200"
  action: block
  severity: P1
  applies_to: ["**/*.py", "**/*.js", "**/*.ts", "**/*.java", "**/*.go"]
  references: []

- id: coding-api-no-version-in-url
  level: SHOULD
  category: api
  description: "API 版本应通过 header 而非 URL 路径传递"
  enforcer: cr
  pattern: "/api/v\\d+/"
  message: "建议通过 Accept header 或自定义 header 传递 API 版本"
  action: warn
  severity: P3
  applies_to: ["**/*.py", "**/*.js", "**/*.ts", "**/*.java", "**/*.go"]
  references: []

- id: coding-no-swallor-error
  level: MUST
  category: error-handling
  description: "禁止吞没异常后不做任何处理"
  enforcer: cr
  pattern: "(catch|except)\\s*\\([^)]*\\)\\s*\\{\\s*\\}|(catch|except)\\s*\\([^)]*\\)\\s*:\\s*pass"
  message: "捕获异常后必须进行处理，至少记录日志"
  action: block
  severity: P1
  applies_to: ["**/*.java", "**/*.py", "**/*.js", "**/*.ts", "**/*.go"]
  references: []

- id: coding-no-exception-for-flow
  level: SHOULD
  category: error-handling
  description: "禁止使用异常控制正常业务流程"
  enforcer: cr
  pattern: "(raise|throw)\\s+\\w+Exception\\s*\\(\\s*['\"]not found"
  message: "不应使用异常来控制正常的业务流程，请使用返回值判断"
  action: warn
  severity: P2
  applies_to: ["**/*.py", "**/*.js", "**/*.ts", "**/*.java", "**/*.go"]
  references: []

- id: coding-no-generic-exception-type
  level: SHOULD
  category: error-handling
  description: "抛出的异常应使用具体类型而非通用类型"
  enforcer: cr
  pattern: "(raise|throw)\\s+(Exception|RuntimeException|Error)\\s*\\("
  message: "请使用具体的异常类型，如 NotFoundException、ValidationException 等"
  action: warn
  severity: P2
  applies_to: ["**/*.py", "**/*.js", "**/*.ts", "**/*.java", "**/*.go"]
  references: []

- id: coding-structured-logging
  level: SHOULD
  category: logging
  description: "应使用结构化日志而非自由文本"
  enforcer: cr
  pattern: "(log|logger)\\.(info|warn|error|debug)\\s*\\(\\s*[\"']"
  message: "建议使用结构化日志格式（如 JSON），便于日志分析和检索"
  action: warn
  severity: P3
  applies_to: ["**/*.py", "**/*.js", "**/*.ts", "**/*.java", "**/*.go"]
  references: []

- id: coding-no-log-sensitive-header
  level: MUST
  category: logging
  description: "禁止记录 HTTP 请求头中的敏感信息"
  enforcer: cr
  pattern: "log\\(.*(authorization|cookie|set-cookie|x-api-key)"
  message: "禁止在日志中记录 Authorization/Cookie 等敏感请求头"
  action: block
  severity: P0
  applies_to: ["**/*.py", "**/*.js", "**/*.ts", "**/*.java", "**/*.go"]
  references: []

- id: coding-log-correlation-id
  level: SHOULD
  category: logging
  description: "日志应包含关联 ID 以便追踪"
  enforcer: cr
  pattern: "(log|logger)\\.(info|warn|error)\\((?!.*correlation|.*trace|.*request.id)"
  message: "建议在日志中包含 correlation ID 或 trace ID 以便分布式追踪"
  action: warn
  severity: P3
  applies_to: ["**/*.py", "**/*.js", "**/*.ts", "**/*.java", "**/*.go"]
  references: []

- id: coding-no-shared-mutable-state
  level: MUST
  category: concurrency
  description: "并发环境下禁止共享可变状态"
  enforcer: cr
  pattern: "(static|shared|global)\\s*(var|let|variable|field)\\s+\\w+\\s*[=:]"
  message: "并发环境下共享可变状态会导致竞态条件，请使用同步机制或不可变对象"
  action: block
  severity: P1
  applies_to: ["**/*.py", "**/*.js", "**/*.ts", "**/*.java", "**/*.go"]
  references: []

- id: coding-no-double-check-lock
  level: SHOULD
  category: concurrency
  description: "避免使用双重检查锁定模式"
  enforcer: cr
  pattern: "if\\s*\\(.*==\\s*null\\).*synchronized.*if\\s*\\(.*==\\s*null"
  message: "双重检查锁定容易出错，请使用其他线程安全初始化方式"
  action: warn
  severity: P2
  applies_to: ["**/*.java"]
  references: []

- id: coding-no-missing-doc-public
  level: SHOULD
  category: documentation
  description: "公共 API 必须包含文档注释"
  enforcer: cr
  pattern: "(public|export)\\s+(function|class|interface|def|async)\\s+\\w+(?!.*[/\\*#]+)"
  message: "公共 API 应包含文档注释说明用途、参数和返回值"
  action: warn
  severity: P3
  applies_to: ["**/*.py", "**/*.js", "**/*.ts", "**/*.java", "**/*.go"]
  references: []

- id: coding-no-doc-outdated-todo
  level: SHOULD
  category: documentation
  description: "文档中的 TODO 应标注日期和负责人"
  enforcer: cr
  pattern: "TODO\\s*:(?!.*\\d{4}-\\d{2})"
  message: "文档中的 TODO 应标注日期（如 TODO: 2024-01 @owner）"
  action: warn
  severity: P3
