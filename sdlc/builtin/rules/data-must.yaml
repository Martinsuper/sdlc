- id: no-collect-action
  level: MUST
  category: performance
  description: "禁止在 Spark 中使用 collect() 获取全量数据到 Driver"
  enforcer: cr
  pattern: "\\.collect\\(\\)"
  message: "禁止使用 collect() 将全量数据拉到 Driver，请使用 take() 或写入存储"
  action: block
  severity: P1
  applies_to: ["**/*.py", "**/*.scala", "**/*.java"]
  references: []

- id: no-shuffle-without-partition
  level: SHOULD
  category: performance
  description: "Shuffle 操作前应指定分区数"
  enforcer: cr
  pattern: "\\.(groupBy|reduceByKey|join|cogroup)\\("
  message: "请在 Shuffle 操作中指定分区数以避免性能问题"
  action: warn
  severity: P2
  applies_to: ["**/*.py", "**/*.scala", "**/*.java"]
  references: []

- id: no-cache-without-action
  level: SHOULD
  category: performance
  description: "cache() 后必须有 action 触发"
  enforcer: cr
  pattern: "\\.cache\\(\\)"
  message: "cache() 后必须有 action 操作才会真正缓存，请确认使用方式"
  action: warn
  severity: P3
  applies_to: ["**/*.py", "**/*.scala", "**/*.java"]
  references: []

- id: no-select-star
  level: MUST
  category: performance
  description: "禁止使用 SELECT *"
  enforcer: cr
  pattern: "SELECT\\s+\\*"
  message: "禁止使用 SELECT *，请明确列出需要的字段"
  action: block
  severity: P1
  applies_to: ["**/*.sql", "**/*.py", "**/*.java"]
  references: []

- id: no-implicit-join
  level: SHOULD
  category: quality
  description: "禁止使用隐式 JOIN"
  enforcer: cr
  pattern: "FROM\\s+\\w+\\s*,\\s*\\w+\\s+WHERE"
  message: "请使用显式 JOIN 语法，不要使用 FROM a, b WHERE 形式"
  action: warn
  severity: P2
  applies_to: ["**/*.sql", "**/*.py"]
  references: []

- id: no-n+1-query
  level: MUST
  category: performance
  description: "禁止 N+1 查询模式"
  enforcer: cr
  pattern: "for\\s+\\w+\\s+in\\s+.*\\.all\\(\\).*\\.(get|filter|find)\\("
  message: "检测到可能的 N+1 查询，请使用批量查询或预加载"
  action: warn
  severity: P1
  applies_to: ["**/*.py", "**/*.java", "**/*.js", "**/*.ts"]
  references: []

- id: no-full-table-scan
  level: MUST
  category: performance
  description: "查询必须有索引支持"
  enforcer: cr
  pattern: "WHERE\\s+\\w+\\s+(NOT\\s+)?IN\\s*\\(SELECT"
  message: "子查询可能导致全表扫描，请考虑使用 JOIN"
  action: warn
  severity: P1
  applies_to: ["**/*.sql", "**/*.py"]
  references: []

- id: no-uncapped-result
  level: MUST
  category: reliability
  description: "查询结果必须设置上限"
  enforcer: cr
  pattern: "(SELECT|find|filter|query)\\((?!.*LIMIT|.*limit|.*take|.*fetch)"
  message: "查询结果必须设置上限，防止内存溢出"
  action: warn
  severity: P1
  applies_to: ["**/*.sql", "**/*.py", "**/*.java"]
  references: []

- id: no-hardcoded-credentials
  level: MUST
  category: security
  description: "数据管道中禁止硬编码凭证"
  enforcer: cr
  pattern: "(password|secret|token|access_key)\\s*=\\s*[\"'][^\"']+[\"']"
  message: "数据管道中的凭证必须通过密钥管理服务获取"
  action: block
  severity: P0
  applies_to: ["**/*.py", "**/*.scala", "**/*.java", "**/*.sql"]
  references: []

- id: no-drop-without-backup
  level: MUST
  category: reliability
  description: "DROP 操作前必须有备份"
  enforcer: cr
  pattern: "DROP\\s+(TABLE|DATABASE|SCHEMA)"
  message: "DROP 操作不可逆，必须先备份再执行"
  action: block
  severity: P0
  applies_to: ["**/*.sql"]
  references: []

- id: no-unsafe-udf
  level: MUST
  category: security
  description: "UDF 必须经过安全审查"
  enforcer: cr
  pattern: "(CREATE|REPLACE)\\s+(FUNCTION|PROCEDURE)"
  message: "自定义函数必须经过安全审查，防止恶意代码执行"
  action: warn
  severity: P1
  applies_to: ["**/*.sql", "**/*.py", "**/*.java"]
  references: []

- id: no-data-leak-log
  level: MUST
  category: security
  description: "禁止在日志中泄露数据内容"
  enforcer: cr
  pattern: "(log|logger|print|println)\\(.*(row|record|data|dataset)"
  message: "禁止在日志中打印数据行内容"
  action: block
  severity: P0
  applies_to: ["**/*.py", "**/*.scala", "**/*.java"]
  references: []

- id: no-unencrypted-storage
  level: MUST
  category: security
  description: "数据存储必须启用加密"
  enforcer: cr
  pattern: "(aws_s3_bucket|google_storage_bucket|azurerm_storage_container)\\s+\\w+"
  message: "数据存储必须启用加密"
  action: block
  severity: P0
  applies_to: ["**/*.tf", "**/*.py"]
  references: []

- id: no-missing-partition
  level: SHOULD
  category: performance
  description: "大表应配置分区策略"
  enforcer: cr
  pattern: "CREATE\\s+TABLE\\s+\\w+\\s*\\((?!.*PARTITION)"
  message: "大表应配置分区以提高查询性能"
  action: warn
  severity: P2
  applies_to: ["**/*.sql"]
  references: []

- id: no-missing-retention
  level: SHOULD
  category: governance
  description: "数据集必须配置保留策略"
  enforcer: cr
  pattern: "(lifecycle|retention|expire|ttl)"
  message: "数据集应配置保留策略以控制存储成本和合规要求"
  action: warn
  severity: P2
  applies_to: ["**/*.tf", "**/*.yaml", "**/*.yml"]
  references: []

- id: no-public-dataset
  level: MUST
  category: security
  description: "数据集禁止公开访问"
  enforcer: cr
  pattern: "(public|allUsers|allAuthenticatedUsers)"
  message: "数据集不应设置为公开访问"
  action: block
  severity: P0
  applies_to: ["**/*.tf", "**/*.sql", "**/*.py"]
  references: []

- id: no-unsafe-deserialization
  level: MUST
  category: security
  description: "禁止使用不安全的反序列化"
  enforcer: cr
  pattern: "(pickle\\.loads?|yaml\\.load\\((?!.*Loader)|ObjectInputStream|Marshal\\.load)"
  message: "不安全的反序列化可能导致远程代码执行"
  action: block
  severity: P0
  applies_to: ["**/*.py", "**/*.java", "**/*.scala"]
  references: []

- id: no-schema-drift
  level: SHOULD
  category: reliability
  description: "Schema 变更必须通过迁移工具"
  enforcer: cr
  pattern: "(ALTER\\s+TABLE|DROP\\s+COLUMN|MODIFY\\s+COLUMN)"
  message: "Schema 变更必须通过迁移工具管理，禁止直接修改"
  action: warn
  severity: P1
  applies_to: ["**/*.sql"]
  references: []

- id: no-missing-null-check
  level: MUST
  category: reliability
  description: "查询结果必须处理 NULL 值"
  enforcer: cr
  pattern: "(\\.get\\(|\\[\\s*['\"][^'\"]+['\"]\\s*\\])(?!.*(?:if|coalesce|isNull|isNone|null|None))"
  message: "访问可能为 NULL 的字段时必须进行空值检查"
  action: warn
  severity: P1
  applies_to: ["**/*.py", "**/*.java", "**/*.sql"]
  references: []

- id: no-integer-overflow
  level: MUST
  category: reliability
  description: "大数计算应防止溢出"
  enforcer: cr
  pattern: "(COUNT\\(\\*\\)|SUM\\(|sum\\(|count\\()"
  message: "聚合结果可能超出整数范围，请使用更大的数据类型"
  action: warn
  severity: P1
  applies_to: ["**/*.sql", "**/*.py", "**/*.java"]
  references: []

- id: no-timezone-naive
  level: MUST
  category: reliability
  description: "时间数据必须包含时区信息"
  enforcer: cr
  pattern: "(datetime\\.datetime\\((?!.*tzinfo)|pd\\.Timestamp\\((?!.*tz)|TIMESTAMP(?!.*WITH.*TIME.*ZONE))"
  message: "时间数据必须包含时区信息以避免时区转换错误"
  action: warn
  severity: P1
  applies_to: ["**/*.py", "**/*.sql", "**/*.java"]
  references: []

- id: no-unsafe-cast
  level: MUST
  category: reliability
  description: "类型转换必须验证数据有效性"
  enforcer: cr
  pattern: "(CAST\\(|astype\\(|int\\(|float\\(|str\\()"
  message: "类型转换可能导致数据丢失，请验证数据有效性"
  action: warn
  severity: P1
  applies_to: ["**/*.sql", "**/*.py", "**/*.java"]
  references: []

- id: no-sample-bias
  level: SHOULD
  category: quality
  description: "数据采样应避免偏差"
  enforcer: cr
  pattern: "\\.sample\\(|\\.limit\\(|RANDOM\\(\\)|RAND\\(\\)"
  message: "数据采样可能引入偏差，请验证采样方法的随机性"
  action: warn
  severity: P2
  applies_to: ["**/*.sql", "**/*.py", "**/*.scala"]
  references: []

- id: no-pii-exposure
  level: MUST
  category: security
  description: "PII 数据必须脱敏处理"
  enforcer: cr
  pattern: "(email|phone|address|name|birth|ssn|social_security)\\s*(=|:|,)\\s*['\"][^'\"]+['\"]"
  message: "PII 数据必须脱敏或加密存储"
  action: block
  severity: P0
  applies_to: ["**/*.py", "**/*.sql", "**/*.java", "**/*.scala"]
  references: []

- id: no-missing-data-validation
  level: MUST
  category: reliability
  description: "数据处理管道必须包含验证步骤"
  enforcer: cr
  pattern: "(read|load|ingest|import)\\s*\\((?!.*validate|.*schema|.*check)"
  message: "数据读取后必须有验证步骤确保数据质量"
  action: warn
  severity: P1
  applies_to: ["**/*.py", "**/*.scala", "**/*.java"]
  references: []

- id: data-no-spark-collect-driver
  level: MUST
  category: spark
  description: "Spark 大数据集不应使用 collect() 到 Driver"
  enforcer: cr
  pattern: "\\.collect\\s*\\(\\s*\\)"
  message: "大数据集应使用 take() 或写入存储，不应 collect() 到 Driver 内存"
