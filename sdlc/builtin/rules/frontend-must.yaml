- id: no-inline-styles
  level: SHOULD
  category: styling
  description: "禁止使用内联样式，应使用 CSS 类"
  enforcer: cr
  pattern: "style=\\{"
  message: "请使用 CSS 类或 styled-components 而非内联样式"
  action: warn
  severity: P3
  applies_to: ["**/*.jsx", "**/*.tsx", "**/*.vue"]
  references: []

- id: no-direct-dom-access
  level: MUST
  category: framework
  description: "禁止直接操作 DOM"
  enforcer: cr
  pattern: "document\\.(getElementById|querySelector|innerHTML)"
  message: "禁止直接操作 DOM，请使用框架提供的响应式方式"
  action: block
  severity: P1
  applies_to: ["**/*.jsx", "**/*.tsx", "**/*.vue"]
  references: []

- id: no-any-type
  level: MUST
  category: typescript
  description: "禁止使用 any 类型"
  enforcer: cr
  pattern: ":\\s*any[\\s,);\\]]"
  message: "禁止使用 any 类型，请定义具体类型"
  action: block
  severity: P2
  applies_to: ["**/*.ts", "**/*.tsx"]
  references: []

- id: no-dangerously-set-innerhtml
  level: MUST
  category: security
  description: "禁止使用 dangerouslySetInnerHTML"
  enforcer: cr
  pattern: "dangerouslySetInnerHTML"
  message: "dangerouslySetInnerHTML 可能导致 XSS 攻击，请使用安全的渲染方式"
  action: block
  severity: P0
  applies_to: ["**/*.jsx", "**/*.tsx"]
  references: []

- id: no-eval-jsx
  level: MUST
  category: security
  description: "禁止在 JSX 中使用 eval"
  enforcer: cr
  pattern: "(eval\\s*\\(|new\\s+Function\\s*\\()"
  message: "JSX 中禁止使用 eval，存在代码注入风险"
  action: block
  severity: P0
  applies_to: ["**/*.jsx", "**/*.tsx", "**/*.vue"]
  references: []

- id: no-inline-styles-secret
  level: MUST
  category: security
  description: "禁止在内联样式中包含敏感信息"
  enforcer: cr
  pattern: "style=\\{.*((api_?key|secret|password|token)\\s*:)"
  message: "内联样式中不应包含敏感信息"
  action: block
  severity: P0
  applies_to: ["**/*.jsx", "**/*.tsx", "**/*.vue"]
  references: []

- id: no-unsafe-href
  level: MUST
  category: security
  description: "禁止使用 javascript: 协议的 href"
  enforcer: cr
  pattern: "href\\s*=\\s*[\"']javascript:"
  message: "javascript: 协议的 href 存在 XSS 风险"
  action: block
  severity: P0
  applies_to: ["**/*.jsx", "**/*.tsx", "**/*.vue", "**/*.html"]
  references: []

- id: no-target-blank
  level: MUST
  category: security
  description: "target=_blank 必须配合 rel=noopener"
  enforcer: cr
  pattern: "target\\s*=\\s*[\"']_blank[\"'](?![^<]*rel\\s*=\\s*[\"'][^\"']*noopener)"
  message: "target=_blank 必须添加 rel=noopener noreferrer 防止 tabnapping 攻击"
  action: warn
  severity: P1
  applies_to: ["**/*.jsx", "**/*.tsx", "**/*.vue", "**/*.html"]
  references: []

- id: no-v-html-unsafe
  level: MUST
  category: security
  description: "禁止使用 v-html 渲染用户输入"
  enforcer: cr
  pattern: "v-html"
  message: "v-html 可能导致 XSS 攻击，请使用 v-text 或组件渲染"
  action: block
  severity: P0
  applies_to: ["**/*.vue"]
  references: []

- id: no-document-write
  level: MUST
  category: security
  description: "禁止使用 document.write()"
  enforcer: cr
  pattern: "document\\.write\\s*\\("
  message: "document.write() 存在安全风险且影响性能"
  action: block
  severity: P1
  applies_to: ["**/*.js", "**/*.ts", "**/*.jsx", "**/*.tsx", "**/*.vue"]
  references: []

- id: no-window-open
  level: SHOULD
  category: security
  description: "谨慎使用 window.open()"
  enforcer: cr
  pattern: "window\\.open\\s*\\("
  message: "window.open() 可能被滥用，请验证目标 URL"
  action: warn
  severity: P2
  applies_to: ["**/*.js", "**/*.ts", "**/*.jsx", "**/*.tsx", "**/*.vue"]
  references: []

- id: no-innerhtml-usage
  level: MUST
  category: security
  description: "禁止使用 innerHTML"
  enforcer: cr
  pattern: "\\.innerHTML\\s*="
  message: "innerHTML 存在 XSS 风险，请使用 textContent 或 DOM API"
  action: block
  severity: P0
  applies_to: ["**/*.js", "**/*.ts", "**/*.jsx", "**/*.tsx", "**/*.vue"]
  references: []

- id: no-localstorage-sensitive
  level: MUST
  category: security
  description: "禁止在 localStorage 中存储敏感信息"
  enforcer: cr
  pattern: "localStorage\\.setItem\\(.*(token|password|secret|api_?key|credential)"
  message: "localStorage 不应存储敏感信息，请使用 httpOnly cookie"
  action: block
  severity: P0
  applies_to: ["**/*.js", "**/*.ts", "**/*.jsx", "**/*.tsx", "**/*.vue"]
  references: []

- id: no-console-log-prod
  level: SHOULD
  category: quality
  description: "生产构建中应移除 console 语句"
  enforcer: cr
  pattern: "console\\.(log|debug|trace|info)\\("
  message: "生产代码中应移除 console 调试语句"
  action: warn
  severity: P2
  applies_to: ["**/*.js", "**/*.ts", "**/*.jsx", "**/*.tsx", "**/*.vue"]
  references: []

- id: no-unused-css
  level: SHOULD
  category: quality
  description: "避免未使用的 CSS 样式"
  enforcer: cr
  pattern: ""
  message: "检测到可能未使用的 CSS 样式"
  action: warn
  severity: P3
  applies_to: ["**/*.css", "**/*.scss", "**/*.less"]
  references: []

- id: no-missing-alt-text
  level: MUST
  category: accessibility
  description: "img 标签必须包含 alt 属性"
  enforcer: cr
  pattern: "<img[^>]*(?!alt=)[^>]*>"
  message: "img 标签必须包含有意义的 alt 属性"
  action: warn
  severity: P1
  applies_to: ["**/*.jsx", "**/*.tsx", "**/*.vue", "**/*.html"]
  references: []

- id: no-missing-aria-label
  level: SHOULD
  category: accessibility
  description: "交互元素必须有可访问的标签"
  enforcer: cr
  pattern: "(<button[^>]*>|<a[^>]*href[^>]*>)(?!.*aria-label)"
  message: "交互元素缺少 aria-label 或文字内容，影响无障碍访问"
  action: warn
  severity: P2
  applies_to: ["**/*.jsx", "**/*.tsx", "**/*.vue", "**/*.html"]
  references: []

- id: no-auto-focus
  level: SHOULD
  category: accessibility
  description: "避免使用 autoFocus 属性"
  enforcer: cr
  pattern: "autoFocus|autofocus"
  message: "autoFocus 可能对屏幕阅读器用户造成困扰"
  action: warn
  severity: P2
  applies_to: ["**/*.jsx", "**/*.tsx", "**/*.vue", "**/*.html"]
  references: []

- id: no-positive-tabindex
  level: MUST
  category: accessibility
  description: "禁止使用正数 tabindex"
  enforcer: cr
  pattern: "tabIndex\\s*=\\s*[\"']?[1-9]|tabindex\\s*=\\s*[\"']?[1-9]"
  message: "正数 tabindex 会干扰自然的 Tab 顺序，请使用 0 或 -1"
  action: block
  severity: P1
  applies_to: ["**/*.jsx", "**/*.tsx", "**/*.vue", "**/*.html"]
  references: []

- id: no-missing-key-prop
  level: MUST
  category: framework
  description: "列表渲染必须提供 key 属性"
  enforcer: cr
  pattern: "\\.map\\s*\\([^)]*=>\\s*(<\\w+[^>]*(?!key=))"
  message: "列表渲染中缺少 key 属性，可能导致渲染异常"
  action: block
  severity: P1
  applies_to: ["**/*.jsx", "**/*.tsx", "**/*.vue"]
  references: []

- id: no-array-index-key
  level: SHOULD
  category: framework
  description: "避免使用数组索引作为 key"
  enforcer: cr
  pattern: "key\\s*=\\s*\\{\\s*index|key\\s*=\\s*\\{\\s*i\\s*\\}"
  message: "使用数组索引作为 key 可能导致渲染问题，请使用唯一标识"
  action: warn
  severity: P2
  applies_to: ["**/*.jsx", "**/*.tsx", "**/*.vue"]
  references: []

- id: no-missing-proptypes
  level: SHOULD
  category: quality
  description: "React 组件应定义 PropTypes"
  enforcer: cr
  pattern: "PropTypes\\."
  message: "建议为组件定义 PropTypes 类型检查"
  action: warn
  severity: P3
  applies_to: ["**/*.jsx", "**/*.tsx"]
  references: []

- id: no-stale-closure
  level: MUST
  category: reliability
  description: "useEffect 中引用的状态可能已过时"
  enforcer: cr
  pattern: "useEffect\\s*\\(\\s*\\(\\)\\s*=>\\s*\\{[^}]*(?!return)"
  message: "useEffect 中的闭包可能捕获过时的状态，请检查依赖数组"
  action: warn
  severity: P1
  applies_to: ["**/*.jsx", "**/*.tsx"]
  references: []

- id: no-memory-leak-effect
  level: MUST
  category: reliability
  description: "useEffect 必须返回清理函数"
  enforcer: cr
  pattern: "useEffect\\s*\\(\\s*\\(\\)\\s*=>\\s*\\{[^}]*\\b(addEventListener|subscribe|setInterval|setTimeout)\\b"
  message: "useEffect 中注册的监听器/订阅必须通过清理函数释放"
  action: warn
  severity: P1
  applies_to: ["**/*.jsx", "**/*.tsx"]
  references: []

- id: no-dependency-array-missing
  level: MUST
  category: reliability
  description: "useEffect/useMemo/useCallback 必须提供依赖数组"
  enforcer: cr
  pattern: "use(Callback|Effect|Memo|LayoutEffect)\\s*\\(\\s*\\(\\)\\s*=>\\s*[^,]+\\s*\\)"
  message: "Hook 必须提供依赖数组以确保行为正确"
  action: warn
  severity: P1
  applies_to: ["**/*.jsx", "**/*.tsx"]
  references: []

- id: no-unsafe-url-construct
  level: MUST
  category: security
  description: "URL 构造时必须验证协议"
  enforcer: cr
  pattern: "new\\s+URL\\s*\\(.*\\+|url\\s*\\+.*\\+"
  message: "动态构造 URL 时必须验证协议，防止 javascript: 注入"
  action: block
  severity: P1
  applies_to: ["**/*.js", "**/*.ts", "**/*.jsx", "**/*.tsx", "**/*.vue"]
  references: []

- id: frontend-no-useeffect-async
  level: MUST
  category: react
  description: "useEffect 回调不应直接使用 async"
  enforcer: cr
  pattern: "useEffect\\s*\\(\\s*async\\s*\\("
  message: "useEffect 回调不能是 async 函数，请在内部定义异步函数"
  action: block
  severity: P1
  applies_to: ["**/*.jsx", "**/*.tsx"]
  references: []

- id: frontend-no-usestate-object-mutation
  level: MUST
  category: react
  description: "useState 对象状态禁止直接修改"
  enforcer: cr
  pattern: "set\\w+\\s*\\(\\s*Object\\.assign\\(\\s*state|set\\w+\\s*\\(\\s*\\[\\.\\.\\.(?!state)"
  message: "React 状态更新必须使用不可变方式，禁止直接修改原对象"
  action: block
  severity: P1
  applies_to: ["**/*.jsx", "**/*.tsx"]
  references: []

- id: frontend-no-missing-usememo
  level: SHOULD
  category: react
  description: "昂贵计算应使用 useMemo 缓存"
  enforcer: cr
  pattern: "const\\s+\\w+\\s*=\\s*\\w+\\.map\\(.*\\.map\\(|const\\s+\\w+\\s*=\\s*\\w+\\.filter\\(.*\\.map\\("
  message: "链式数组操作结果应使用 useMemo 缓存以避免重复计算"
  action: warn
  severity: P2
  applies_to: ["**/*.jsx", "**/*.tsx"]
  references: []

- id: frontend-no-usecallback-missing
  level: SHOULD
  category: react
  description: "传递给子组件的回调应使用 useCallback"
  enforcer: cr
  pattern: "<\\w+\\s+on\\w+=\\s*\\{\\s*\\(.*\\)\\s*=>"
  message: "传递给子组件的回调函数应使用 useCallback 包裹以避免不必要的重渲染"
  action: warn
  severity: P2
  applies_to: ["**/*.jsx", "**/*.tsx"]
  references: []

- id: frontend-no-useeffect-fetch-no-cleanup
  level: MUST
  category: react
  description: "useEffect 中的 fetch 请求必须支持取消"
  enforcer: cr
  pattern: "useEffect\\s*\\(.*fetch\\s*\\((?!.*AbortController|.*signal)"
  message: "useEffect 中的网络请求应使用 AbortController 支持取消"
  action: block
  severity: P1
  applies_to: ["**/*.jsx", "**/*.tsx"]
  references: []

- id: frontend-no-react-lifecycle-misuse
  level: SHOULD
  category: react
  description: "函数组件中不应使用类组件生命周期方法"
  enforcer: cr
  pattern: "componentDidMount|componentWillUnmount|componentDidUpdate"
  message: "函数组件应使用 useEffect 替代类组件生命周期方法"
  action: warn
  severity: P2
  applies_to: ["**/*.jsx", "**/*.tsx"]
  references: []

- id: frontend-no-vue-setup-no-return
  level: MUST
  category: vue
  description: "Vue setup() 必须返回模板可访问的变量"
  enforcer: cr
  pattern: "setup\\s*\\(\\s*\\)\\s*\\{(?![^}]*return)"
  message: "Vue setup() 必须返回模板需要的响应式变量"
  action: warn
  severity: P1
  applies_to: ["**/*.vue"]
  references: []

- id: frontend-no-vue-reactivity-loss
  level: MUST
  category: vue
  description: "Vue 响应式对象解构会丢失响应性"
  enforcer: cr
  pattern: "const\\s*\\{[^}]+\\}\\s*=\\s*\\w+\\.value|const\\s*\\{[^}]+\\}\\s*=\\s*reactive"
  message: "解构 reactive 对象会丢失响应性，请使用 toRefs"
  action: block
  severity: P1
  applies_to: ["**/*.vue", "**/*.ts"]
  references: []

- id: frontend-no-vue-v-for-no-key
  level: MUST
  category: vue
  description: "v-for 必须绑定 :key"
  enforcer: cr
  pattern: "v-for=(?!.*:key)"
  message: "v-for 指令必须绑定唯一的 :key 属性"
  action: block
  severity: P1
  applies_to: ["**/*.vue"]
  references: []

- id: frontend-no-vue-mutate-prop
  level: MUST
  category: vue
  description: "Vue 子组件禁止直接修改 props"
  enforcer: cr
  pattern: "props\\.\\w+\\s*="
  message: "禁止直接修改 props，请使用 emit 通知父组件更新"
  action: block
  severity: P1
  applies_to: ["**/*.vue"]
  references: []

- id: frontend-no-redux-mutate-state
  level: MUST
  category: state
  description: "Redux reducer 禁止直接修改 state"
  enforcer: cr
  pattern: "state\\.\\w+\\s*=|state\\[.*\\]\\s*="
  message: "Redux reducer 必须返回新的 state 对象，禁止直接修改"
  action: block
  severity: P0
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: frontend-no-redux-non-serializable
  level: SHOULD
  category: state
  description: "Redux store 中禁止存储不可序列化的值"
  enforcer: cr
  pattern: "store\\.dispatch\\s*\\(.*(?:function|Date|Map|Set|Symbol)"
  message: "Redux store 中只应存储可序列化的数据"
  action: warn
  severity: P2
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: frontend-no-pinia-action-no-return
  level: SHOULD
  category: state
  description: "Pinia action 中异步操作应处理错误"
  enforcer: cr
  pattern: "actions\\s*:\\s*\\{.*async\\s+\\w+\\s*\\([^)]*\\)\\s*\\{(?![^}]*try|[^}]*catch)"
  message: "Pinia 异步 action 应使用 try/catch 处理错误"
  action: warn
  severity: P2
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: frontend-no-css-in-js-runtime
  level: SHOULD
  category: styling
  description: "CSS-in-JS 运行时应在构建时提取样式"
  enforcer: cr
  pattern: "styled\\.\\w+`|css`"
  message: "建议使用零运行时 CSS-in-JS 方案（如 vanilla-extract）减少运行时开销"
  action: warn
  severity: P2
  applies_to: ["**/*.jsx", "**/*.tsx", "**/*.ts"]
  references: []

- id: frontend-no-important-css
  level: SHOULD
  category: styling
  description: "CSS 中禁止使用 !important"
  enforcer: cr
  pattern: "!important"
  message: "!important 会破坏 CSS 优先级，请通过选择器特异性解决"
  action: warn
  severity: P3
  applies_to: ["**/*.css", "**/*.scss", "**/*.less"]
  references: []

- id: frontend-no-responsive-missing
  level: SHOULD
  category: responsive
  description: "布局应有响应式适配"
  enforcer: cr
  pattern: "width\\s*:\\s*\\d{4,}px"
  message: "固定宽度超过 1024px 的元素应有响应式适配方案"
  action: warn
  severity: P2
  applies_to: ["**/*.css", "**/*.scss", "**/*.less", "**/*.jsx", "**/*.tsx"]
  references: []

- id: frontend-no-fixed-viewport
  level: SHOULD
  category: responsive
  description: "不应使用固定视口宽度"
  enforcer: cr
  pattern: "max-width\\s*:\\s*\\d{4,}px"
  message: "建议使用相对单位和流式布局，避免固定最大宽度"
  action: warn
  severity: P3
  applies_to: ["**/*.css", "**/*.scss", "**/*.less"]
  references: []

- id: frontend-no-web-vitals-ignored
  level: SHOULD
  category: performance
  description: "应用应监控 Core Web Vitals 指标"
  enforcer: cr
  pattern: ""
  message: "建议集成 web-vitals 库监控 LCP、FID、CLS 等指标"
  action: warn
  severity: P2
  applies_to: ["**/package.json"]
  references: []

- id: frontend-no-large-bundle
  level: SHOULD
  category: performance
  description: "单个 JS 包不应超过 250KB"
  enforcer: cr
  pattern: ""
  message: "建议使用代码分割和懒加载减小初始包大小"
  action: warn
  severity: P2
  applies_to: ["**/webpack.config.*", "**/vite.config.*", "**/rollup.config.*"]
  references: []

- id: frontend-no-sw-cache-everything
  level: MUST
  category: pwa
  description: "Service Worker 不应缓存所有请求"
  enforcer: cr
  pattern: "event\\.respondWith\\s*\\(\\s*caches\\.match\\((?!.*request)"
  message: "Service Worker 缓存策略应区分静态资源和 API 请求"
  action: block
  severity: P1
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: frontend-no-sw-skip-waiting
  level: SHOULD
  category: pwa
  description: "Service Worker 应谨慎使用 skipWaiting"
  enforcer: cr
  pattern: "self\\.skipWaiting\\s*\\("
  message: "skipWaiting 可能导致用户使用旧页面和新 Service Worker 的不一致状态"
  action: warn
  severity: P2
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: frontend-no-pwa-no-manifest
  level: MUST
  category: pwa
  description: "PWA 必须包含 manifest.json"
  enforcer: cr
  pattern: ""
  message: "PWA 应用必须包含 Web App Manifest 文件"
  action: block
  severity: P1
  applies_to: ["**/index.html"]
  references: []

- id: frontend-no-i18n-hardcoded-string
  level: SHOULD
  category: i18n
  description: "用户可见文本不应硬编码"
  enforcer: cr
  pattern: "<(h[1-6]|p|span|button|label|a)\\b[^>]*>[^<{]+</"
  message: "用户可见文本应使用 i18n 翻译函数而非硬编码"
  action: warn
  severity: P3
  applies_to: ["**/*.jsx", "**/*.tsx", "**/*.vue"]
  references: []

- id: frontend-no-i18n-concat
  level: MUST
  category: i18n
  description: "禁止拼接翻译字符串"
  enforcer: cr
  pattern: "t\\s*\\(.*\\+|t\\s*\\(.*\\$\\{(?!.*\\})"
  message: "翻译字符串不应拼接，请使用插值参数（如 t('hello', {name})）"
  action: block
  severity: P1
  applies_to: ["**/*.jsx", "**/*.tsx", "**/*.vue", "**/*.js", "**/*.ts"]
  references: []

- id: frontend-no-a11y-missing-lang
  level: MUST
  category: a11y
  description: "html 标签必须设置 lang 属性"
  enforcer: cr
  pattern: "<html(?!.*lang\\s*=)"
  message: "html 标签必须设置 lang 属性以支持屏幕阅读器"
  action: block
  severity: P1
  applies_to: ["**/*.html", "**/*.jsx", "**/*.tsx", "**/*.vue"]
  references: []

- id: frontend-no-a11y-missing-role
  level: SHOULD
  category: a11y
  description: "自定义交互组件必须有适当的 ARIA role"
  enforcer: cr
  pattern: "<div\\s+onClick(?!.*role\\s*=)"
  message: "可交互的 div 必须设置 role 属性以支持辅助技术"
  action: warn
  severity: P2
  applies_to: ["**/*.jsx", "**/*.tsx", "**/*.vue", "**/*.html"]
  references: []

- id: frontend-no-a11y-img-decorative
  level: SHOULD
  category: a11y
  description: "装饰性图片应设置 alt 为空"
  enforcer: cr
  pattern: "<img[^>]*(?:role\\s*=\\s*\"presentation\"|alt\\s*=\\s*\"[^\"]+\")[^>]*role\\s*=\\s*\"presentation\""
  message: "装饰性图片应设置 alt=\"\" 而非描述性文本"
  action: warn
  severity: P3
  applies_to: ["**/*.jsx", "**/*.tsx", "**/*.vue", "**/*.html"]
  references: []

- id: frontend-no-a11y-focus-trap
  level: SHOULD
  category: a11y
  description: "模态框应实现焦点陷阱"
  enforcer: cr
  pattern: "<(Modal|Dialog|Drawer)(?!.*focusTrap|.*trapFocus)"
  message: "模态框应实现焦点陷阱，确保键盘用户不会意外离开"
  action: warn
  severity: P2
  applies_to: ["**/*.jsx", "**/*.tsx", "**/*.vue"]
  references: []

- id: frontend-no-a11y-color-contrast
  level: SHOULD
  category: a11y
  description: "文本颜色对比度应满足 WCAG 2.1 AA 标准"
  enforcer: cr
  pattern: "color\\s*:\\s*#(?:[0-9a-f]{3}){1,2}"
  message: "文本颜色对比度应满足 WCAG 2.1 AA 标准（4.5:1）"
  action: warn
  severity: P2
  applies_to: ["**/*.css", "**/*.scss", "**/*.less"]
  references: []

- id: frontend-no-ssr-window-access
  level: MUST
  category: ssr
  description: "SSR 代码中禁止直接访问 window 对象"
  enforcer: cr
  pattern: "(typeof\\s+window\\s*===\\s*['\"]undefined['\"]|window\\.)"
  message: "SSR 渲染期间 window 不存在，应使用 typeof 检查或 useEffect"
  action: warn
  severity: P1
  applies_to: ["**/*.jsx", "**/*.tsx", "**/*.ts", "**/*.js"]
  references: []

- id: frontend-no-ssr-mismatch
  level: MUST
  category: ssr
  description: "SSR 和客户端渲染结果应一致"
  enforcer: cr
  pattern: "typeof\\s+window\\s*!==\\s*['\"]undefined['\"]\\s*\\?.*:\\s*"
  message: "SSR/CSR 条件渲染可能导致 hydration 不匹配，请使用 useEffect 延迟客户端逻辑"
  action: warn
  severity: P1
  applies_to: ["**/*.jsx", "**/*.tsx"]
  references: []

- id: frontend-no-ssg-dynamic-data
  level: SHOULD
  category: ssg
  description: "静态生成页面不应包含动态数据"
  enforcer: cr
  pattern: "getStaticProps.*fetch\\(|getStaticProps.*axios"
  message: "getStaticProps 中的数据获取应确保构建时确定性和稳定性"
  action: warn
  severity: P2
  applies_to: ["**/*.jsx", "**/*.tsx", "**/*.js", "**/*.ts"]
  references: []

- id: frontend-no-hydration-mismatch
  level: MUST
  category: ssr
  description: "避免 SSR/CSR 内容不一致"
  enforcer: cr
  pattern: "suppressHydrationWarning"
  message: "suppressHydrationWarning 掩盖了 SSR/CSR 不一致问题，请修复根本原因"
  action: warn
  severity: P1
  applies_to: ["**/*.jsx", "**/*.tsx"]
  references: []

- id: frontend-no-redirect-meta-refresh
  level: SHOULD
  category: quality
  description: "避免使用 meta refresh 重定向"
  enforcer: cr
  pattern: "meta\\s+http-equiv\\s*=\\s*[\"']refresh"
  message: "meta refresh 重定向对 SEO 和可访问性不友好，请使用服务端重定向"
  action: warn
  severity: P2
  applies_to: ["**/*.html"]
  references: []

- id: frontend-no-react-strict-mode-missing
  level: SHOULD
  category: react
  description: "React 应用应使用 StrictMode"
  enforcer: cr
  pattern: "ReactDOM\\.createRoot(?!.*StrictMode)"
  message: "建议在开发环境中使用 React.StrictMode 以检测潜在问题"
  action: warn
  severity: P3
  applies_to: ["**/*.jsx", "**/*.tsx"]
  references: []

- id: frontend-no-react-key-fragments
  level: SHOULD
  category: react
  description: "Fragment 列表渲染必须使用 key"
  enforcer: cr
  pattern: "<Fragment>|<React\\.Fragment>|<>[\\s\\n]*\\{.*\\.map"
  message: "Fragment 中使用列表渲染时必须指定 key 属性"
  action: warn
  severity: P2
  applies_to: ["**/*.jsx", "**/*.tsx"]
  references: []

- id: frontend-no-vue-v-model-without-emit
  level: MUST
  category: vue
  description: "自定义 v-model 必须定义 emit 事件"
  enforcer: cr
  pattern: "modelValue.*props(?!.*emit\\s*\\(|.*defineEmits)"
  message: "自定义 v-model 组件必须通过 emit('update:modelValue') 更新值"
  action: block
  severity: P1
  applies_to: ["**/*.vue"]
  references: []

- id: frontend-no-css-z-index-high
  level: SHOULD
  category: styling
  description: "z-index 值不应过高"
  enforcer: cr
  pattern: "z-index\\s*:\\s*[1-9]\\d{3,}"
  message: "z-index 值过高会破坏层叠上下文，建议控制在 100 以内"
  action: warn
  severity: P3
  applies_to: ["**/*.css", "**/*.scss", "**/*.less", "**/*.jsx", "**/*.tsx"]
  references: []

- id: frontend-no-a11y-interactive-no-keyboard
  level: MUST
  category: a11y
  description: "可交互元素必须支持键盘操作"
  enforcer: cr
  pattern: "onClick\\s*=\\s*\\{(?!.*onKeyDown|.*onKeyPress|.*role)"
  message: "onClick 事件处理器必须同时支持键盘事件以符合 WCAG 2.1"
  action: block
  severity: P1
  applies_to: ["**/*.jsx", "**/*.tsx", "**/*.vue"]
  references: []