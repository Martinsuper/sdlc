  severity: P1
  applies_to: ["**/*.go"]
  references: []

- id: go-no-http-no-timeout
  level: MUST
  category: reliability
  description: "HTTP 客户端必须设置超时"
  enforcer: cr
  pattern: "http\\.Client\\s*\\{\\s*\\}"
  message: "HTTP 客户端必须设置 Timeout 字段以防止请求挂起"
  action: block
  severity: P1
  applies_to: ["**/*.go"]
  references: []

- id: go-no-json-decode-body
  level: SHOULD
  category: reliability
  description: "应使用 json.NewDecoder 解析 HTTP 请求体"
  enforcer: cr
  pattern: "json\\.Unmarshal\\s*\\(.*ioutil\\.ReadAll"
  message: "HTTP 请求体应使用 json.NewDecoder(r.Body).Decode() 直接解析"
  action: warn
  severity: P2
  applies_to: ["**/*.go"]
  references: []

- id: go-no-ioutil-deprecated
  level: MUST
  category: quality
  description: "ioutil 包已在 Go 1.16 中废弃"
  enforcer: cr
  pattern: "ioutil\\."
  message: "ioutil 已废弃，请使用 io 和 os 包中的替代函数"
  action: block
  severity: P1
  applies_to: ["**/*.go"]
  references: []

- id: go-no-sprintf-concat-error
  level: SHOULD
  category: error
  description: "错误消息拼接不应使用 fmt.Sprintf + errors.New"
  enforcer: cr
  pattern: "errors\\.New\\s*\\(\\s*fmt\\.Sprintf"
  message: "请使用 fmt.Errorf 代替 errors.New(fmt.Sprintf(...))"
  action: warn
  severity: P3
  applies_to: ["**/*.go"]
  references: []

- id: go-no-mutex-value
  level: MUST
  category: design
  description: "Mutex 不应作为值类型传递"
  enforcer: cr
  pattern: "func\\s+\\w+\\s*\\([^)]*sync\\.(Mutex|RWMutex)\\s+\\w+"
  message: "Mutex 应通过指针传递，值传递会导致锁失效"
  action: block
  severity: P0
  applies_to: ["**/*.go"]
  references: []

- id: go-no-waitgroup-add-in-goroutine
  level: MUST
  category: concurrency
  description: "WaitGroup.Add 不应在 goroutine 内调用"
  enforcer: cr
  pattern: "go\\s+func.*Add\\s*\\(\\s*1\\s*\\)"
  message: "WaitGroup.Add() 应在启动 goroutine 前调用，避免竞态条件"
  action: block
  severity: P1
  applies_to: ["**/*.go"]
  references: []