- id: no-panic-in-lib
  level: MUST
  category: error-handling
  description: "禁止在库代码中使用 panic"
  enforcer: cr
  pattern: "panic\\("
  message: "禁止在库代码中使用 panic，请返回 error"
  action: block
  severity: P1
  applies_to: ["**/*.go"]
  references: []

- id: must-check-error
  level: MUST
  category: error-handling
  description: "必须检查 error 返回值"
  enforcer: cr
  pattern: "(?<!if\\s)\\w+\\(.*\\)\\s*;(?!\\s*if\\s+err)"
  message: "必须检查函数返回的 error，不要忽略它"
  action: warn
  severity: P1
  applies_to: ["**/*.go"]
  references: []

- id: no-global-vars
  level: SHOULD
  category: design
  description: "避免使用全局变量"
  enforcer: cr
  pattern: "^var\\s+\\w+\\s+"
  message: "避免使用包级全局变量，考虑使用依赖注入"
  action: warn
  severity: P2
  applies_to: ["**/*.go"]
  references: []

- id: no-unsafe-pointer
  level: MUST
  category: safety
  description: "禁止使用 unsafe.Pointer"
  enforcer: cr
  pattern: "unsafe\\.Pointer"
  message: "unsafe.Pointer 绕过类型安全，除非有充分理由否则禁止使用"
  action: block
  severity: P0
  applies_to: ["**/*.go"]
  references: []

- id: no-cgo-unsafe
  level: MUST
  category: safety
  description: "禁止使用 unsafe 包与 CGo 交互"
  enforcer: cr
  pattern: "import\\s+\"unsafe\"|unsafe\\.Pointer.*C\\."
  message: "CGo 与 unsafe 组合使用极易引发内存安全问题"
  action: block
  severity: P0
  applies_to: ["**/*.go"]
  references: []

- id: no-os-exit-main
  level: MUST
  category: reliability
  description: "禁止在 main 以外的函数中调用 os.Exit"
  enforcer: cr
  pattern: "os\\.Exit\\("
  message: "os.Exit 会跳过 defer 和清理逻辑，请使用 error 传播"
  action: block
  severity: P1
  applies_to: ["**/*.go"]
  references: []

- id: no-error-ignored
  level: MUST
  category: error-handling
  description: "禁止忽略 error 返回值"
  enforcer: cr
  pattern: "_\\s*,?\\s*:?=?\\s*\\w+\\(.*\\)(?!.*if\\s+err)"
  message: "不要忽略 error 返回值，必须处理或显式记录"
  action: block
  severity: P1
  applies_to: ["**/*.go"]
  references: []

- id: no-panic-recover
  level: SHOULD
  category: error-handling
  description: "避免使用 panic/recover 作为常规错误处理"
  enforcer: cr
  pattern: "recover\\s*\\(\\)"
  message: "panic/recover 不应用于常规错误处理，请返回 error"
  action: warn
  severity: P2
  applies_to: ["**/*.go"]
  references: []

- id: no-goroutine-leak
  level: MUST
  category: reliability
  description: "goroutine 必须有退出机制"
  enforcer: cr
  pattern: "go\\s+func\\s*\\("
  message: "goroutine 必须有退出机制（context 取消或 done channel）"
  action: warn
  severity: P1
  applies_to: ["**/*.go"]
  references: []

- id: no-global-mutex
  level: SHOULD
  category: design
  description: "避免使用包级全局互斥锁"
  enforcer: cr
  pattern: "var\\s+\\w+\\s+sync\\.(Mutex|RWMutex)"
  message: "全局互斥锁可能导致死锁，请封装在结构体中"
  action: warn
  severity: P2
  applies_to: ["**/*.go"]
  references: []

- id: no-sql-string-concat
  level: MUST
  category: security
  description: "禁止通过字符串拼接构造 SQL 查询"
  enforcer: cr
  pattern: "(fmt\\.Sprintf|\\+).*SELECT|fmt\\.Sprintf.*INSERT|fmt\\.Sprintf.*UPDATE|fmt\\.Sprintf.*DELETE"
  message: "请使用参数化查询，不要拼接 SQL 字符串"
  action: block
  severity: P0
  applies_to: ["**/*.go"]
  references: []

- id: no-hardcoded-credentials
  level: MUST
  category: security
  description: "禁止硬编码凭证"
  enforcer: cr
  pattern: "(password|secret|token|apikey|api_key)\\s*:?=?\\s*[\"'][^\"']+[\"']"
  message: "禁止硬编码凭证，请使用环境变量或配置"
  action: block
  severity: P0
  applies_to: ["**/*.go"]
  references: []

- id: no-unsafe-reflection
  level: SHOULD
  category: safety
  description: "谨慎使用 reflect 包"
  enforcer: cr
  pattern: "reflect\\.(ValueOf|TypeOf|FieldByName|MethodByName)"
  message: "reflect 操作绕过编译时类型检查，请确认必要性"
  action: warn
  severity: P2
  applies_to: ["**/*.go"]
  references: []

- id: no-struct-without-json
  level: SHOULD
  category: design
  description: "API 响应结构体应包含 json 标签"
  enforcer: cr
  pattern: "type\\s+\\w+\\s+struct\\s*\\{"
  message: "结构体应包含 json 标签以规范序列化行为"
  action: warn
  severity: P3
  applies_to: ["**/*.go"]
  references: []

- id: no-unsupported-marshaling
  level: MUST
  category: reliability
  description: "禁止序列化不可序列化的类型"
  enforcer: cr
  pattern: "json\\.Marshal\\(.*(chan|func|unsafe)"
  message: "channel、函数和 unsafe 类型不能被 JSON 序列化"
  action: block
  severity: P1
  applies_to: ["**/*.go"]
  references: []

- id: no-file-path-traversal
  level: MUST
  category: security
  description: "文件路径必须验证防止目录遍历"
  enforcer: cr
  pattern: "(os\\.Open|os\\.ReadFile|ioutil\\.ReadFile)\\s*\\(.*\\+"
  message: "文件路径包含动态拼接，请验证防止路径遍历攻击"
  action: block
  severity: P0
  applies_to: ["**/*.go"]
  references: []

- id: no-weak-rand
  level: MUST
  category: security
  description: "安全场景禁止使用 math/rand"
  enforcer: cr
  pattern: "math/rand|math\\\\rand|rand\\.(Intn|Float64|Read)"
  message: "安全相关场景请使用 crypto/rand 而非 math/rand"
  action: block
  severity: P0
  applies_to: ["**/*.go"]
  references: []

- id: no-net-listen-all
  level: MUST
  category: security
  description: "网络监听不应绑定 0.0.0.0"
  enforcer: cr
  pattern: "net\\.Listen\\s*\\(.*0\\.0\\.0\\.0|net\\.Listen\\s*\\(.*:.*\\)"
  message: "监听 0.0.0.0 会暴露到所有网络接口，请绑定特定地址"
  action: warn
  severity: P1
  applies_to: ["**/*.go"]
  references: []

- id: no-debug-endpoint
  level: MUST
  category: security
  description: "生产环境禁止暴露 debug 端点"
  enforcer: cr
  pattern: "(debug|pprof|expvar)\\.Handler|/debug/"
  message: "生产环境不应暴露 debug/pprof/expvar 端点"
  action: block
  severity: P0
  applies_to: ["**/*.go"]
  references: []

- id: no-missing-defer-close
  level: MUST
  category: reliability
  description: "打开的资源必须 defer Close()"
  enforcer: cr
  pattern: "(os\\.Open|os\\.Create|os\\.OpenFile)\\s*\\((?!.*defer.*Close)"
  message: "打开的文件必须通过 defer Close() 确保释放"
  action: warn
  severity: P1
  applies_to: ["**/*.go"]
  references: []

- id: no-empty-interface
  level: SHOULD
  category: design
  description: "避免使用 interface{} 作为类型"
  enforcer: cr
  pattern: "interface\\s*\\{\\s*\\}"
  message: "interface{} 缺乏类型约束，请使用具体类型或泛型"
  action: warn
  severity: P2
  applies_to: ["**/*.go"]
  references: []

- id: no-naked-goroutine
  level: MUST
  category: reliability
  description: "goroutine 必须有错误处理"
  enforcer: cr
  pattern: "go\\s+(func|\\w+\\()"
  message: "裸启动的 goroutine 中的 panic 会导致程序崩溃，请添加 recover"
  action: warn
  severity: P1
  applies_to: ["**/*.go"]
  references: []

- id: no-race-condition
  level: MUST
  category: reliability
  description: "共享变量必须使用同步机制"
  enforcer: cr
  pattern: "(?<!sync\\.)(?<!atomic\\.)\\w+\\s*:?=?\\s*\\d+"
  message: "并发访问共享变量必须使用 mutex 或 atomic 操作"
  action: warn
  severity: P1
  applies_to: ["**/*.go"]
  references: []

- id: no-unsafe-cast
  level: SHOULD
  category: safety
  description: "类型断言必须检查 ok 值"
  enforcer: cr
  pattern: "\\.\\(\\w+\\)(?!.*ok)"
  message: "类型断言必须使用 value, ok := x.(T) 形式检查"
  action: warn
  severity: P1
  applies_to: ["**/*.go"]
  references: []

- id: no-redundant-import
  level: SHOULD
  category: quality
  description: "禁止未使用的导入"
  enforcer: cr
  pattern: "import\\s*\\("
  message: "请移除未使用的导入包"
  action: warn
  severity: P3
  applies_to: ["**/*.go"]
  references: []

- id: go-no-context-background
  level: SHOULD
  category: context
  description: "避免使用 context.Background() 替代请求上下文"
  enforcer: cr
  pattern: "context\\.Background\\s*\\("
  message: "请求处理中应传递请求上下文而非使用 context.Background()"
  action: warn
  severity: P2
  applies_to: ["**/*.go"]
  references: []

- id: go-no-context-todo
  level: SHOULD
  category: context
  description: "不应遗留 context.TODO() 在生产代码中"
  enforcer: cr
  pattern: "context\\.TODO\\s*\\("
  message: "context.TODO() 是临时占位符，请在上线前替换为合适的上下文"
  action: warn
  severity: P2
  applies_to: ["**/*.go"]
  references: []

- id: go-no-context-not-propagated
  level: MUST
  category: context
  description: "函数接收 context 时必须向下传递"
  enforcer: cr
  pattern: "func\\s+\\w+\\s*\\(\\s*ctx\\s+context\\.Context.*\\)\\s*\\{(?!.*ctx)"
  message: "接收 ctx 参数的函数应将 context 传递给下游调用"
  action: block
  severity: P1
  applies_to: ["**/*.go"]
  references: []

- id: go-no-error-wrapping-fmt
  level: SHOULD
  category: error
  description: "错误包装应使用 fmt.Errorf %w 而非 %v"
  enforcer: cr
  pattern: "fmt\\.Errorf\\s*\\(.*%v(?!.*%w)"
  message: "错误包装应使用 %w 动词以保留错误链，便于 errors.Is/As 判断"
  action: warn
  severity: P2
  applies_to: ["**/*.go"]
  references: []

- id: go-no-error-check-ignored
  level: MUST
  category: error
  description: "defer 中的错误也必须检查"
  enforcer: cr
  pattern: "defer\\s+\\w+\\.Close\\s*\\((?!.*err)"
  message: "defer Close() 的错误也应检查，请使用 defer func() { err = f.Close() }()"
  action: block
  severity: P1
  applies_to: ["**/*.go"]
  references: []

- id: go-no-error-string-compare
  level: SHOULD
  category: error
  description: "错误比较应使用 errors.Is 而非字符串匹配"
  enforcer: cr
  pattern: "err\\.Error\\(\\)\\s*==|strings\\.Contains\\s*\\(.*err\\.Error"
  message: "应使用 errors.Is/As 判断错误类型，而非比较错误消息字符串"
  action: warn
  severity: P2
  applies_to: ["**/*.go"]
  references: []

- id: go-no-interface-large
  level: SHOULD
  category: design
  description: "接口方法不应超过5个"
  enforcer: cr
  pattern: "type\\s+\\w+\\s+interface\\s*\\{"
  message: "接口应保持小巧（Go 惯例），方法过多应拆分"
  action: warn
  severity: P3
  applies_to: ["**/*.go"]
  references: []

- id: go-no-interface-empty-method
  level: SHOULD
  category: design
  description: "接口应从消费者而非实现者定义"
  enforcer: cr
  pattern: "type\\s+\\w+\\s+interface\\s*\\{\\s*\\w+\\([^)]*\\)\\s*\\w+"
  message: "建议在使用处定义小接口，而非提前定义大接口"
  action: warn
  severity: P3
  applies_to: ["**/*.go"]
  references: []

- id: go-no-struct-return-interface
  level: SHOULD
  category: design
  description: "函数应返回结构体指针而非接口"
  enforcer: cr
  pattern: "func\\s+New\\w+\\s*\\([^)]*\\)\\s+\\w+Interface"
  message: "Go 惯例是返回具体类型，让调用者按需转为接口"
  action: warn
  severity: P3
  applies_to: ["**/*.go"]
  references: []

- id: go-no-channel-unbuffered-high-load
  level: SHOULD
  category: channel
  description: "高负载场景应使用带缓冲 channel"
  enforcer: cr
  pattern: "make\\s*\\(\\s*chan\\s+\\w+\\s*\\)"
  message: "高负载场景下无缓冲 channel 可能成为瓶颈，请考虑缓冲大小"
  action: warn
  severity: P2
  applies_to: ["**/*.go"]
  references: []

- id: go-no-channel-leak
  level: MUST
  category: channel
  description: "channel 必须在所有路径上关闭"
  enforcer: cr
  pattern: "make\\s*\\(\\s*chan\\s+\\w+\\s*\\)(?!.*close)"
  message: "channel 生产者必须确保关闭 channel，防止 goroutine 泄漏"
  action: block
  severity: P1
  applies_to: ["**/*.go"]
  references: []

- id: go-no-select-without-default
  level: SHOULD
  category: channel
  description: "select 中应有 default 分支或超时"
  enforcer: cr
  pattern: "select\\s*\\{(?!.*default|.*time\\.After)"
  message: "select 语句应有 default 分支或超时机制以避免永久阻塞"
  action: warn
  severity: P2
  applies_to: ["**/*.go"]
  references: []

- id: go-no-select-case-continue
  level: SHOULD
  category: channel
  description: "select case 不应使用 continue"
  enforcer: cr
  pattern: "select\\s*\\{.*case.*continue"
  message: "select case 中的 continue 会跳出 select 而非循环，请确认意图"
  action: warn
  severity: P2
  applies_to: ["**/*.go"]
  references: []

- id: go-no-test-no-t-run
  level: SHOULD
  category: testing
  description: "测试函数应使用 t.Run 组织子测试"
  enforcer: cr
  pattern: "func\\s+Test\\w+\\s*\\(\\s*t\\s*\\*testing\\.T\\s*\\)\\s*\\{"
  message: "建议使用 t.Run 组织子测试，提升测试输出可读性"
  action: warn
  severity: P3
  applies_to: ["**/*_test.go"]
  references: []

- id: go-no-test-no-table-driven
  level: SHOULD
  category: testing
  description: "多场景测试应使用表驱动模式"
  enforcer: cr
  pattern: "func\\s+Test\\w+\\s*\\(\\s*t\\s*\\*testing\\.T\\s*\\)\\s*\\{\\s*\\n\\s*(if|for)"
  message: "多场景测试应使用表驱动（table-driven）模式组织"
  action: warn
  severity: P3
  applies_to: ["**/*_test.go"]
  references: []

- id: go-no-test-build-tag
  level: SHOULD
  category: testing
  description: "测试文件不应包含构建标签"
  enforcer: cr
  pattern: "//go:build\\s+(?!ignore)"
  message: "测试文件不应使用构建标签排除，所有测试应始终可运行"
  action: warn
  severity: P2
  applies_to: ["**/*_test.go"]
  references: []

- id: go-no-benchmark-missing
  level: SHOULD
  category: benchmarking
  description: "性能关键代码应编写基准测试"
  enforcer: cr
  pattern: ""
  message: "性能关键路径应编写 Benchmark 函数以跟踪性能退化"
  action: warn
  severity: P3
  applies_to: ["**/*_test.go"]
  references: []

- id: go-no-benchmark-no-b-n
  level: SHOULD
  category: benchmarking
  description: "基准测试应使用 b.N 控制循环"
  enforcer: cr
  pattern: "func\\s+Benchmark\\w+\\s*\\(\\s*b\\s*\\*testing\\.B(?!.*b\\.N)"
  message: "基准测试循环应使用 for i := 0; i < b.N; i++"
  action: warn
  severity: P2
  applies_to: ["**/*_test.go"]
  references: []

- id: go-no-fuzz-missing
  level: SHOULD
  category: fuzzing
  description: "解析外部输入的函数应编写模糊测试"
  enforcer: cr
  pattern: "func\\s+(Parse|Decode|Unmarshal|Read)\\w+"
  message: "解析外部输入的函数应编写 Fuzz 浽数以确保鲁棒性"
  action: warn
  severity: P3
  applies_to: ["**/*.go"]
  references: []

- id: go-no-cgo-no-comment
  level: MUST
  category: cgo
  description: "CGo 代码必须包含安全说明注释"
  enforcer: cr
  pattern: "import\\s+\"C\""
  message: "CGo 调用必须注释说明 C 代码来源和安全性验证"
  action: warn
  severity: P1
  applies_to: ["**/*.go"]
  references: []

- id: go-no-cgo-pointer-escape
  level: MUST
  category: cgo
  description: "CGo 中禁止传递 Go 指针到 C"
