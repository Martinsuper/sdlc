- id: infra-no-docker-latest-tag
  level: MUST
  category: docker
  description: "Dockerfile 中 FROM 不应使用 latest 标签"
  enforcer: cr
  pattern: "FROM\\s+\\w+(?::latest)?\\s*$"
  message: "Dockerfile FROM 指令必须使用明确的版本标签"
  action: block
  severity: P1
  applies_to: ["**/Dockerfile*", "**/*.dockerfile"]
  references: []

- id: infra-no-docker-root-user
  level: MUST
  category: docker
  description: "Dockerfile 应指定非 root 用户"
  enforcer: cr
  pattern: "FROM.*(?!.+USER\\s+\\w+)"
  message: "Dockerfile 应添加 USER 指令指定非 root 运行用户"
  action: warn
  severity: P1
  applies_to: ["**/Dockerfile*", "**/*.dockerfile"]
  references: []

- id: infra-no-docker-apt-no-cleanup
  level: SHOULD
  category: docker
  description: "Dockerfile 中 apt-get 安装后应清理缓存"
  enforcer: cr
  pattern: "apt-get\\s+install(?!.*rm\\s+-rf|.*&&\\s*rm)"
  message: "apt-get install 后应清理 /var/lib/apt/lists/ 减小镜像大小"
  action: warn
  severity: P2
  applies_to: ["**/Dockerfile*", "**/*.dockerfile"]
  references: []