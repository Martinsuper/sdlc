- id: infra-no-tf-variable-no-description
  level: SHOULD
  category: terraform
  description: "Terraform variable 必须包含 description"
  enforcer: cr
  pattern: "variable\\s+\"\\w+\"\\s*\\{(?!.*description)"
  message: "Terraform variable 应包含 description 说明用途"
  action: warn
  severity: P2
  applies_to: ["**/*.tf"]
  references: []

- id: infra-no-tf-variable-no-type
  level: MUST
  category: terraform
  description: "Terraform variable 必须声明类型"
  enforcer: cr
  pattern: "variable\\s+\"\\w+\"\\s*\\{(?!.*type)"
  message: "Terraform variable 必须声明 type 以确保输入验证"
  action: block
  severity: P1
  applies_to: ["**/*.tf"]
  references: []

- id: infra-no-aws-iam-wildcard
  level: MUST
  category: aws-iam
  description: "AWS IAM 策略禁止使用通配符"
