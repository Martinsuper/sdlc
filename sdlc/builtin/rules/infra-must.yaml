- id: infra-no-helm-hardcoded-image
  level: MUST
  category: helm
  description: "Helm Chart 中镜像不应硬编码"
  enforcer: cr
  pattern: "image\\s*:\\s*[\"']?[a-z]+/[a-z]+:[\\d.]+[\"']?"
  message: "镜像应通过 .Values.image 引用而非硬编码"
  action: block
  severity: P1
  applies_to: ["**/templates/**/*.yaml", "**/templates/**/*.yml"]
  references: []

- id: infra-no-tf-module-no-variables
  level: MUST
  category: terraform
  description: "Terraform 模块必须声明 variables.tf"
  enforcer: cr
  pattern: ""
  message: "Terraform 模块必须声明 variables.tf 和 outputs.tf"
  action: block
  severity: P1
  applies_to: ["**/main.tf"]
  references: []

- id: infra-no-tf-module-no-outputs
  level: MUST
  category: terraform
  description: "Terraform 模块必须声明 outputs.tf"
  enforcer: cr
  pattern: ""
  message: "Terraform 模块必须声明 outputs.tf 以暴露输出值"
  action: block
  severity: P1
  applies_to: ["**/main.tf"]
  references: []

- id: infra-no-tf-no-version-constraint
  level: MUST
  category: terraform
  description: "Terraform provider 必须指定版本约束"
  enforcer: cr
  pattern: "provider\\s+\"\\w+\"\\s*\\{"
