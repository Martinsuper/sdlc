  category: secret
  description: "密钥必须配置自动轮换"
  enforcer: cr
  pattern: "aws_secretsmanager_secret\\s+\\w+"
  message: "Secrets Manager 中的密钥应配置自动轮换"
  action: warn
  severity: P1
  applies_to: ["**/*.tf"]
  references: []

- id: infra-no-secret-in-env-var
  level: MUST
  category: secret
  description: "禁止在环境变量中传递密钥"
