  pattern: "(aws_db_instance|aws_rds_cluster|google_sql_database_instance|azurerm_mssql_database)\\s+\\w+"
  message: "数据库实例必须配置自动备份"
  action: block
  severity: P0
  applies_to: ["**/*.tf"]
  references: []

- id: infra-no-dr-no-cross-region
  level: SHOULD
  category: dr
  description: "关键服务应配置跨区域冗余"
  enforcer: cr
  pattern: "aws_db_instance\\s+\\w+"
