  action: warn
  severity: P1
  applies_to: ["**/*.tf"]
  references: []

- id: infra-no-dr-no-runbook
  level: SHOULD
  category: dr
  description: "关键服务应有故障恢复手册"
  enforcer: cr
  pattern: ""
