- id: infra-no-bcp-no-rto-rpo
  level: SHOULD
  category: bcp
  description: "关键服务应定义 RTO 和 RPO"
  enforcer: cr
  pattern: ""
  message: "关键服务应定义恢复时间目标（RTO）和恢复点目标（RPO）"
  action: warn
  severity: P2
  applies_to: ["**/*.md", "**/*.yaml", "**/*.yml"]
