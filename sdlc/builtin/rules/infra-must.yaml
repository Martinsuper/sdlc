  severity: P1
  applies_to: ["**/Chart.yaml"]
  references: []

- id: infra-no-helm-no-readme
  level: SHOULD
  category: helm
  description: "Helm Chart 应包含 README.md"
  enforcer: cr
  pattern: ""
  message: "Helm Chart 应包含 README.md 说明安装和配置方法"
  action: warn
  severity: P3
  applies_to: ["**/Chart.yaml"]
  references: []

- id: infra-no-helm-crd-in-template
  level: MUST
  category: helm
  description: "CRD 不应放在 templates 目录中"
  enforcer: cr
  pattern: ""
  message: "CRD 应放在 crds/ 目录而非 templates/ 目录"
