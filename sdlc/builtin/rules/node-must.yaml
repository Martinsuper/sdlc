- id: no-console-log
  level: SHOULD
  category: logging
  description: "禁止使用 console.log，应使用日志框架"
  enforcer: cr
  pattern: "console\\.log\\("
  message: "请使用日志框架而非 console.log"
  action: warn
  severity: P2
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: no-sync-fs
  level: MUST
  category: performance
  description: "禁止使用同步文件操作"
  enforcer: cr
  pattern: "fs\\.(readFileSync|writeFileSync|appendFileSync|unlinkSync)"
  message: "禁止使用同步文件操作，请使用 fs.promises 或回调版本"
  action: block
  severity: P1
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: no-process-exit
  level: MUST
  category: reliability
  description: "禁止在库代码中使用 process.exit()"
  enforcer: cr
  pattern: "process\\.exit\\("
  message: "禁止使用 process.exit()，请使用优雅关闭方式"
  action: block
  severity: P1
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: no-eval
  level: MUST
  category: security
  description: "禁止使用 eval() 和 new Function()"
  enforcer: cr
  pattern: "(\\beval\\s*\\(|new\\s+Function\\s*\\()"
  message: "eval 和 new Function 存在代码注入风险"
  action: block
  severity: P0
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: no-new-require
  level: MUST
  category: coding
  description: "禁止使用 new require() 模式"
  enforcer: cr
  pattern: "new\\s+require\\s*\\("
  message: "new require() 会导致代码难以分析，请分开写"
  action: block
  severity: P1
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: no-callback-hell
  level: SHOULD
  category: design
  description: "避免深层嵌套回调"
  enforcer: cr
  pattern: "function\\s*\\([^)]*\\)\\s*\\{[^}]*function\\s*\\([^)]*\\)\\s*\\{[^}]*function\\s*\\([^)]*\\)"
  message: "深层嵌套回调难以维护，请使用 async/await 或 Promise"
  action: warn
  severity: P2
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: no-throw-literal
  level: MUST
  category: error-handling
  description: "throw 必须抛出 Error 对象而非字面量"
  enforcer: cr
  pattern: "throw\\s+[\"'{\\d]"
  message: "throw 必须抛出 Error 对象，不能抛出字符串或数字"
  action: block
  severity: P1
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: no-unsafe-regexp
  level: SHOULD
  category: security
  description: "避免使用可能导致 ReDoS 的复杂正则表达式"
  enforcer: cr
  pattern: "(\\(.*\\+.*\\).*\\+|\\(.*\\|.*\\).*\\+|\\[.*\\].*\\{.*\\,)"
  message: "该正则表达式可能导致回溯爆炸 (ReDoS)，请简化"
  action: warn
  severity: P1
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: no-prototype-pollution
  level: MUST
  category: security
  description: "禁止直接修改 Object.prototype 或 __proto__"
  enforcer: cr
  pattern: "(Object\\.prototype\\.\\w+\\s*=|__proto__\\s*=|\\.constructor\\.prototype\\s*=)"
  message: "修改原型链会导致原型污染攻击"
  action: block
  severity: P0
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: no-express-stack-trace
  level: MUST
  category: security
  description: "生产环境禁止暴露 Express 错误堆栈"
  enforcer: cr
  pattern: "app\\.use\\(.*err\\s*,.*res\\.send.*err\\.stack"
  message: "生产环境不应暴露错误堆栈信息"
  action: block
  severity: P0
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: no-cors-wildcard
  level: MUST
  category: security
  description: "禁止使用 CORS 通配符配置"
  enforcer: cr
  pattern: "cors\\s*\\(\\s*\\{.*origin\\s*:\\s*\\*"
  message: "CORS 通配符允许任何来源访问，请指定具体域名"
  action: block
  severity: P0
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: no-helmet-missing
  level: SHOULD
  category: security
  description: "Express 应用应使用 helmet 安全中间件"
  enforcer: cr
  pattern: "app\\.listen\\((?!.*helmet)"
  message: "建议使用 helmet 中间件增强 Express 安全性"
  action: warn
  severity: P1
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: no-body-parser-limit
  level: MUST
  category: security
  description: "body-parser 必须设置请求体大小限制"
  enforcer: cr
  pattern: "bodyParser\\s*\\(\\s*\\)|express\\.json\\s*\\(\\s*\\)|express\\.urlencoded\\s*\\(\\s*\\)"
  message: "请设置请求体大小限制以防止 DoS 攻击"
  action: warn
  severity: P1
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: no-sql-injection-orm
  level: MUST
  category: security
  description: "禁止在 ORM 查询中使用原始 SQL 拼接"
  enforcer: cr
  pattern: "\\.(raw|query)\\s*\\(.*\\+|\\.(raw|query)\\s*\\(.*\\$\\{"
  message: "ORM 原始查询中的字符串拼接可能导致 SQL 注入"
  action: block
  severity: P0
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: no-hardcoded-jwt-secret
  level: MUST
  category: security
  description: "禁止硬编码 JWT 密钥"
  enforcer: cr
  pattern: "jwt\\.(sign|verify)\\s*\\(.*[\"'][^\"']{8,}[\"']\\s*\\)"
  message: "JWT 密钥必须从环境变量获取，不能硬编码"
  action: block
  severity: P0
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: no-unsafe-deserialization
  level: MUST
  category: security
  description: "禁止使用不安全的反序列化方法"
  enforcer: cr
  pattern: "(serialize\\s*\\(|deserialize\\s*\\(|node-serialize)"
  message: "不安全的反序列化可能导致远程代码执行"
  action: block
  severity: P0
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: no-plain-http-request
  level: MUST
  category: security
  description: "禁止使用明文 HTTP 请求传输敏感数据"
  enforcer: cr
  pattern: "(axios|fetch|http\\.get|http\\.request)\\s*\\(.*http://(?!localhost|127\\.0\\.0\\.1)"
  message: "请使用 HTTPS 协议传输数据"
  action: block
  severity: P0
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: no-console-in-prod
  level: SHOULD
  category: quality
  description: "生产代码中禁止使用 console 调试方法"
  enforcer: cr
  pattern: "console\\.(debug|info|warn|error|trace)\\("
  message: "请移除调试用的 console 语句或使用日志框架"
  action: warn
  severity: P2
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: no-unused-vars
  level: SHOULD
  category: quality
  description: "禁止声明未使用的变量"
  enforcer: cr
  pattern: "(const|let|var)\\s+\\w+\\s*="
  message: "检测到未使用的变量声明"
  action: warn
  severity: P3
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: no-var-keyword
  level: MUST
  category: coding
  description: "禁止使用 var 声明变量"
  enforcer: cr
  pattern: "\\bvar\\s+\\w+"
  message: "请使用 const 或 let 代替 var"
  action: block
  severity: P1
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: no-nested-callbacks
  level: SHOULD
  category: design
  description: "避免回调嵌套超过3层"
  enforcer: cr
  pattern: "function\\s*\\([^)]*err[^)]*\\)\\s*\\{[^}]*function\\s*\\([^)]*err[^)]*\\)\\s*\\{"
  message: "回调嵌套过深，请使用 async/await 重构"
  action: warn
  severity: P2
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: no-child-process-shell
  level: MUST
  category: security
  description: "禁止使用 shell 模式的 child_process"
  enforcer: cr
  pattern: "child_process\\.(exec|execSync|spawn)\\s*\\(.*shell\\s*:\\s*true"
  message: "shell 模式存在命令注入风险，请使用数组参数"
  action: block
  severity: P0
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: no-fs-sync
  level: MUST
  category: performance
  description: "禁止使用同步 fs 方法阻塞事件循环"
  enforcer: cr
  pattern: "fs\\.(readFileSync|writeFileSync|readdirSync|statSync|existsSync|mkdirSync|rmdirSync|unlinkSync|accessSync|chmodSync|chownSync|copyFileSync|linkSync|openSync|readlinkSync|realpathSync|renameSync|truncateSync|utimesSync|watchFile|writeFileSync|appendFileSync)"
  message: "同步 fs 方法会阻塞事件循环，请使用异步版本"
  action: block
  severity: P1
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: no-require-absolute
  level: SHOULD
  category: coding
  description: "避免使用绝对路径 require"
  enforcer: cr
  pattern: "require\\s*\\(\\s*[\"']/"
  message: "请使用相对路径或模块名进行 require"
  action: warn
  severity: P2
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: no-dns-lookup-unsafe
  level: SHOULD
  category: security
  description: "DNS 查询结果可能被伪造，不要直接信任"
  enforcer: cr
  pattern: "dns\\.(lookup|resolve|reverse)\\s*\\("
  message: "DNS 查询结果可能被篡改，请验证结果或使用安全 DNS"
  action: warn
  severity: P2
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: node-no-mixed-esm-cjs
  level: SHOULD
  category: modules
  description: "避免在同一项目中混用 ESM 和 CJS"
  enforcer: cr
  pattern: "(require\\s*\\(|module\\.exports\\s*=)(?!.*//.*cjs)"
  message: "建议统一使用 ESM（import/export）或 CJS（require/module.exports）"
  action: warn
  severity: P2
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: node-no-require-in-esm
  level: MUST
  category: modules
  description: "ESM 模块中禁止使用 require()"
  enforcer: cr
  pattern: "import\\s+.*from.*require\\s*\\(|import\\s*=\\s*require"
  message: "ESM 模块应使用 import 而非 require()"
  action: block
  severity: P1
  applies_to: ["**/*.mjs", "**/*.mts"]
  references: []

- id: node-no-create-require
  level: SHOULD
  category: modules
  description: "避免在 ESM 中使用 createRequire 加载 CJS"
  enforcer: cr
  pattern: "createRequire\\s*\\("
  message: "建议迁移依赖到 ESM 而非使用 createRequire 桥接 CJS"
  action: warn
  severity: P3
  applies_to: ["**/*.mjs", "**/*.mts", "**/*.ts"]
  references: []

- id: node-no-npm-scripts-without-lock
  level: MUST
  category: package
  description: "项目必须包含 lock 文件"
  enforcer: cr
  pattern: ""
  message: "项目必须包含 package-lock.json / yarn.lock / pnpm-lock.yaml"
  action: block
  severity: P1
  applies_to: ["**/package.json"]
  references: []

- id: node-no-bin-in-dependencies
  level: MUST
  category: package
  description: "禁止将 CLI 工具安装在 dependencies 中"
  enforcer: cr
  pattern: ""
  message: "CLI 工具应安装在 devDependencies 中，而非 dependencies"
  action: block
  severity: P1
  applies_to: ["**/package.json"]
  references: []

- id: node-no-express-error-middleware
  level: MUST
  category: express
  description: "Express 应用必须配置错误处理中间件"
  enforcer: cr
  pattern: "app\\.listen\\s*\\((?!.*err)"
  message: "Express 应用必须配置 4 参数错误处理中间件 (err, req, res, next)"
  action: warn
  severity: P1
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: node-no-express-sync-middleware
  level: SHOULD
  category: express
  description: "Express 中间件应使用 next() 传递控制"
  enforcer: cr
  pattern: "app\\.(get|post|put|delete|use)\\s*\\(.*function\\s*\\(req,\\s*res\\)\\s*\\{"
  message: "Express 中间件应调用 next() 传递控制权"
  action: warn
  severity: P2
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: node-no-express-unsafe-redirect
  level: MUST
  category: express
  description: "Express 重定向必须验证目标 URL"
  enforcer: cr
  pattern: "res\\.redirect\\s*\\(\\s*req\\."
  message: "重定向目标必须验证，防止开放重定向攻击"
  action: block
  severity: P0
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: node-no-nestjs-unvalidated-pipe
  level: MUST
  category: nestjs
  description: "NestJS 控制器参数应使用 ValidationPipe"
  enforcer: cr
  pattern: "@(Body|Query|Param)\\s*\\(\\s*\\)(?!.*ValidationPipe)"
  message: "NestJS 控制器参数应使用 ValidationPipe 进行自动验证"
  action: block
  severity: P1
  applies_to: ["**/*.ts"]
  references: []

- id: node-no-nestjs-global-guard
  level: SHOULD
  category: nestjs
  description: "NestJS 应配置全局守卫"
  enforcer: cr
  pattern: "@Controller"
  message: "建议配置全局守卫（如 AuthGuard）以统一认证逻辑"
  action: warn
  severity: P2
  applies_to: ["**/*.ts"]
  references: []

- id: node-no-typeorm-raw-query
  level: MUST
  category: typeorm
  description: "TypeORM 中禁止使用原始 SQL 拼接"
  enforcer: cr
  pattern: "\\.query\\s*\\(.*\\+|\\.query\\s*\\(.*\\$\\{"
  message: "TypeORM 原始查询中禁止拼接 SQL，请使用参数化查询"
  action: block
  severity: P0
  applies_to: ["**/*.ts"]
  references: []

- id: node-no-typeorm-find-without-select
  level: SHOULD
  category: typeorm
  description: "TypeORM 查询应指定 select 字段"
  enforcer: cr
  pattern: "\\.find\\s*\\(\\s*\\)"
  message: "TypeORM 查询应指定 select 字段，避免查询不必要的数据"
  action: warn
  severity: P2
  applies_to: ["**/*.ts"]
  references: []

- id: node-no-prisma-raw-unsafe
  level: MUST
  category: prisma
  description: "Prisma 中禁止使用 $queryRawUnsafe"
  enforcer: cr
  pattern: "\\$queryRawUnsafe\\s*\\("
  message: "禁止使用 $queryRawUnsafe，请使用 $queryRaw 或 Prisma Client API"
  action: block
  severity: P0
  applies_to: ["**/*.ts", "**/*.js"]
  references: []

- id: node-no-prisma-n-plus-1
  level: SHOULD
  category: prisma
  description: "Prisma 查询应使用 include/select 避免多次查询"
  enforcer: cr
  pattern: "for\\s*\\(.*await.*\\w+\\.findMany\\("
  message: "循环中的 Prisma 查询可能导致 N+1 问题，请使用 include 预加载"
  action: warn
  severity: P2
  applies_to: ["**/*.ts", "**/*.js"]
  references: []

- id: node-no-ws-unsafe-origin
  level: MUST
  category: websocket
  description: "WebSocket 必须验证连接来源"
  enforcer: cr
  pattern: "new\\s+WebSocket\\.Server\\s*\\(\\s*\\{\\s*\\}\\s*\\)"
  message: "WebSocket 服务应验证 origin 以防止跨站 WebSocket 劫持"
  action: block
  severity: P0
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: node-no-ws-no-auth
  level: MUST
  category: websocket
  description: "WebSocket 连接必须进行认证"
  enforcer: cr
  pattern: "ws\\.on\\s*\\(\\s*['\"]connection['\"]"
  message: "WebSocket 连接事件中应验证身份认证信息"
  action: warn
  severity: P1
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: node-no-stream-pipe-no-error
  level: MUST
  category: stream
  description: "Stream pipe 必须处理错误事件"
  enforcer: cr
  pattern: "\\.pipe\\s*\\((?!.*\\.on\\s*\\(\\s*['\"]error)"
  message: "Stream pipe 必须监听 error 事件以防止进程崩溃"
  action: block
  severity: P1
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: node-no-stream-unfinished
  level: SHOULD
  category: stream
  description: "可写流必须正确关闭"
  enforcer: cr
  pattern: "createWriteStream\\s*\\((?!.*\\.end|.*\\.close|.*pipeline)"
  message: "可写流应使用 stream.pipeline 或显式调用 end() 确保关闭"
  action: warn
  severity: P2
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: node-no-worker-thread-shared-buffer
  level: MUST
  category: worker
  description: "Worker Threads 共享缓冲区必须正确同步"
  enforcer: cr
  pattern: "SharedArrayBuffer|Atomics\\.(wait|notify)"
  message: "SharedArrayBuffer 需要正确的同步机制，请使用 Atomics API"
  action: warn
  severity: P1
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: node-no-worker-unhandled-message
  level: SHOULD
  category: worker
  description: "Worker 应处理所有消息类型"
  enforcer: cr
  pattern: "parentPort\\.on\\s*\\(\\s*['\"]message['\"]"
  message: "Worker 消息处理应覆盖所有消息类型，包括错误消息"
  action: warn
  severity: P2
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: node-no-cluster-without-graceful
  level: SHOULD
  category: cluster
  description: "Cluster 模式应实现优雅重启"
  enforcer: cr
  pattern: "cluster\\.fork\\s*\\((?!.*SIGTERM|.*disconnect)"
  message: "Cluster 应用应实现 SIGTERM 信号的优雅关闭逻辑"
  action: warn
  severity: P2
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: node-no-rate-limit-missing
  level: MUST
  category: security
  description: "API 端点必须配置速率限制"
  enforcer: cr
  pattern: "app\\.(get|post|put|delete|patch)\\s*\\((?!.*rateLimit|.*rateLimiter)"
  message: "API 端点应配置速率限制以防止暴力攻击"
  action: warn
  severity: P1
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: node-no-rate-limit-window-too-long
  level: SHOULD
  category: security
  description: "速率限制窗口不应过长"
  enforcer: cr
  pattern: "windowMs\\s*:\\s*\\d{6,}"
  message: "速率限制窗口时间过长会降低防护效果"
  action: warn
  severity: P2
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: node-no-session-cookie-secure
  level: MUST
  category: session
  description: "Session Cookie 必须设置 secure 标志"
  enforcer: cr
  pattern: "cookie\\s*:\\s*\\{(?!.*secure)"
  message: "Session Cookie 必须设置 secure: true 以防止在 HTTP 中传输"
  action: block
  severity: P0
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: node-no-session-httponly-missing
  level: MUST
  category: session
  description: "Session Cookie 必须设置 httpOnly 标志"
  enforcer: cr
  pattern: "cookie\\s*:\\s*\\{(?!.*httpOnly)"
  message: "Session Cookie 必须设置 httpOnly: true 以防止 XSS 窃取"
  action: block
  severity: P0
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: node-no-session-store-memory
  level: SHOULD
  category: session
  description: "生产环境不应使用内存存储 Session"
  enforcer: cr
  pattern: "MemoryStore|store\\s*:\\s*new\\s*MemoryStore"
  message: "生产环境应使用 Redis 等外部存储，内存存储会导致内存泄漏"
  action: warn
  severity: P1
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: node-no-jwt-no-expiry
  level: MUST
  category: security
  description: "JWT 必须设置过期时间"
  enforcer: cr
  pattern: "jwt\\.sign\\s*\\((?!.*expiresIn)"
  message: "JWT 必须设置 expiresIn 以限制令牌有效期"
  action: block
  severity: P1
  applies_to: ["**/*.js", "**/*.ts"]
  references: []

- id: node-no-jwt-algorithm-none
  level: MUST
  category: security
  description: "JWT 算法禁止使用 none"
  enforcer: cr
  pattern: "algorithm\\s*:\\s*['\"]none['\"]"
  message: "JWT 算法设置为 none 会绕过签名验证"
  action: block
  severity: P0
