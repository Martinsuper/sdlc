- id: no-bare-except
  level: MUST
  category: error-handling
  description: "禁止使用 bare except，必须指定异常类型"
  enforcer: cr
  pattern: "except\\s*:"
  message: "请指定具体异常类型，不要使用 bare except"
  action: block
  severity: P2
  applies_to: ["**/*.py"]
  references: []

- id: no-eval
  level: MUST
  category: security
  description: "禁止使用 eval()"
  enforcer: cr
  pattern: "\\beval\\s*\\("
  message: "eval() 存在安全风险，请使用 ast.literal_eval 或其他替代"
  action: block
  severity: P0
  applies_to: ["**/*.py"]
  references: []

- id: no-mutable-default-args
  level: MUST
  category: coding
  description: "禁止使用可变对象作为函数默认参数"
  enforcer: cr
  pattern: "def\\s+\\w+\\s*\\(.*=\\s*\\[|def\\s+\\w+\\s*\\(.*=\\s*\\{"
  message: "不要使用可变对象作为函数默认参数，请使用 None 代替"
  action: block
  severity: P1
  applies_to: ["**/*.py"]
  references: []

- id: no-wildcard-import
  level: SHOULD
  category: coding
  description: "禁止使用通配符导入"
  enforcer: cr
  pattern: "from\\s+\\w+\\s+import\\s+\\*"
  message: "请使用显式导入，不要使用 from x import *"
  action: warn
  severity: P2
  applies_to: ["**/*.py"]
  references: []

- id: no-star-args
  level: SHOULD
  category: coding
  description: "避免过度使用 *args 和 **kwargs"
  enforcer: cr
  pattern: "def\\s+\\w+\\s*\\(.*\\*\\*kwargs"
  message: "过度使用 **kwargs 会降低代码可读性和类型安全性"
  action: warn
  severity: P3
  applies_to: ["**/*.py"]
  references: []

- id: no-global-vars
  level: SHOULD
  category: design
  description: "避免使用 global 声明修改全局变量"
  enforcer: cr
  pattern: "\\bglobal\\s+\\w+"
  message: "避免使用 global 声明，请使用函数参数或类封装"
  action: warn
  severity: P2
  applies_to: ["**/*.py"]
  references: []

- id: no-type-ignore
  level: SHOULD
  category: quality
  description: "禁止使用 type: ignore 注释"
  enforcer: cr
  pattern: "#\\s*type:\\s*ignore"
  message: "请修复类型问题，不要使用 type: ignore 忽略"
  action: warn
  severity: P2
  applies_to: ["**/*.py"]
  references: []

- id: no-assert-in-prod
  level: MUST
  category: quality
  description: "生产代码中禁止使用 assert 进行业务逻辑判断"
  enforcer: cr
  pattern: "\\bassert\\s+"
  message: "assert 在优化模式下会被跳过，请使用显式的条件检查和异常"
  action: block
  severity: P1
  applies_to: ["**/*.py"]
  references: []

- id: no-print-in-prod
  level: SHOULD
  category: logging
  description: "生产代码中禁止使用 print 输出"
  enforcer: cr
  pattern: "\\bprint\\s*\\("
  message: "请使用 logging 模块而非 print"
  action: warn
  severity: P2
  applies_to: ["**/*.py"]
  references: []

- id: no-pickle-usage
  level: MUST
  category: security
  description: "禁止使用 pickle 序列化"
  enforcer: cr
  pattern: "pickle\\.loads?\\("
  message: "pickle 反序列化存在安全风险，请使用 json 或 msgpack"
  action: block
  severity: P0
  applies_to: ["**/*.py"]
  references: []

- id: no-subprocess-shell
  level: MUST
  category: security
  description: "禁止使用 shell=True 的 subprocess 调用"
  enforcer: cr
  pattern: "subprocess\\.(call|run|Popen|check_output|check_call)\\(.*shell\\s*=\\s*True"
  message: "shell=True 存在命令注入风险，请使用列表形式传参"
  action: block
  severity: P0
  applies_to: ["**/*.py"]
  references: []

- id: no-yaml-load-unsafe
  level: MUST
  category: security
  description: "禁止使用不安全的 yaml.load"
  enforcer: cr
  pattern: "yaml\\.load\\((?!.*Loader)"
  message: "请使用 yaml.safe_load 或 yaml.load(data, Loader=yaml.SafeLoader)"
  action: block
  severity: P0
  applies_to: ["**/*.py"]
  references: []

- id: no-tempfile-race
  level: MUST
  category: security
  description: "禁止使用不安全的临时文件创建方式"
  enforcer: cr
  pattern: "tempfile\\.mktemp\\("
  message: "mktemp 存在竞态条件，请使用 mkstemp 或 NamedTemporaryFile"
  action: block
  severity: P0
  applies_to: ["**/*.py"]
  references: []

- id: no-hardcoded-paths
  level: SHOULD
  category: coding
  description: "禁止硬编码文件路径"
  enforcer: cr
  pattern: "(\"/usr/|\"/etc/|\"/var/|\"/opt/|\"/home/|'C:\\\\|'D:\\\\)"
  message: "请使用配置或 pathlib 管理文件路径"
  action: warn
  severity: P2
  applies_to: ["**/*.py"]
  references: []

- id: no-sql-string-format
  level: MUST
  category: security
  description: "禁止使用字符串格式化构造 SQL"
  enforcer: cr
  pattern: "(cursor\\.execute\\s*\\(.*%|cursor\\.execute\\s*\\(.*\\.format|cursor\\.execute\\s*\\(.*f\")"
  message: "请使用参数化查询，不要用字符串格式化构造 SQL"
  action: block
  severity: P0
  applies_to: ["**/*.py"]
  references: []

- id: no-flask-debug
  level: MUST
  category: security
  description: "Flask 生产环境禁止开启 debug 模式"
  enforcer: cr
  pattern: "app\\.run\\(.*debug\\s*=\\s*True"
  message: "Flask debug 模式会启用交互式调试器，生产环境必须关闭"
  action: block
  severity: P0
  applies_to: ["**/*.py"]
  references: []

- id: no-django-debug
  level: MUST
  category: security
  description: "Django 生产环境禁止开启 DEBUG 模式"
  enforcer: cr
  pattern: "DEBUG\\s*=\\s*True"
  message: "Django DEBUG=True 会暴露敏感信息，生产环境必须设为 False"
  action: block
  severity: P0
  applies_to: ["**/*.py"]
  references: []

- id: no-requests-verify-false
  level: MUST
  category: security
  description: "禁止 requests 调用中禁用 SSL 验证"
  enforcer: cr
  pattern: "requests\\.(get|post|put|delete|patch|head)\\(.*verify\\s*=\\s*False"
  message: "禁用 SSL 验证会导致中间人攻击风险"
  action: block
  severity: P0
  applies_to: ["**/*.py"]
  references: []

- id: no-exec-usage
  level: MUST
  category: security
  description: "禁止使用 exec()"
  enforcer: cr
  pattern: "\\bexec\\s*\\("
  message: "exec() 存在代码注入风险，请重构代码避免动态执行"
  action: block
  severity: P0
  applies_to: ["**/*.py"]
  references: []

- id: no-os-system
  level: MUST
  category: security
  description: "禁止使用 os.system() 执行命令"
  enforcer: cr
  pattern: "os\\.system\\s*\\("
  message: "os.system() 存在命令注入风险，请使用 subprocess 模块"
  action: block
  severity: P0
  applies_to: ["**/*.py"]
  references: []

- id: no-shutil-rmtree-unsafe
  level: MUST
  category: security
  description: "shutil.rmtree 使用时必须处理异常"
  enforcer: cr
  pattern: "shutil\\.rmtree\\s*\\("
  message: "shutil.rmtree 可能删除重要目录，请确保路径验证和异常处理"
  action: warn
  severity: P1
  applies_to: ["**/*.py"]
  references: []

- id: no-xml-sax-parse
  level: MUST
  category: security
  description: "禁止使用不安全的 XML 解析器"
  enforcer: cr
  pattern: "xml\\.sax\\.parse\\(|etree\\.parse\\((?!.*resolve_entities=False)"
  message: "XML 解析可能遭受 XXE 攻击，请使用 defusedxml"
  action: block
  severity: P0
  applies_to: ["**/*.py"]
  references: []

- id: no-pyyaml-load
  level: MUST
  category: security
  description: "禁止使用 yaml.load 不指定 Loader"
  enforcer: cr
  pattern: "yaml\\.load\\s*\\(\\s*[^)]+\\s*\\)(?!.*Loader)"
  message: "请使用 yaml.safe_load() 或指定 Loader=yaml.SafeLoader"
  action: block
  severity: P0
  applies_to: ["**/*.py"]
  references: []