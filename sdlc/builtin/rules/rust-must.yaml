  action: warn
  severity: P2
  applies_to: ["**/*.rs"]
  references: []

- id: no-clone-on-copy
  level: SHOULD
  category: performance
  description: "Copy 类型不需要 clone()"
  enforcer: cr
  pattern: "\\b(u8|u16|u32|u64|i8|i16|i32|i64|f32|f64|bool|char)\\.clone\\(\\)"
  message: "Copy 类型不需要 clone()，直接复制即可"
  action: warn
  severity: P3
  applies_to: ["**/*.rs"]
  references: []

- id: no-unsafe-impl
