id: s-design
name: 架构设计
category: design
description: 根据需求文档进行架构设计与接口定义
subagent: SA-2
model: claude-sonnet-4-6
required_artifacts:
  - prd.md
produces_artifacts:
  - arch.md
  - interfaces.yaml
output_template: templates/backend-design.md
pre_kb_load:
  - architecture/component-catalog.md
  - architecture/dependency-graph.md
post_kb_update:
  - target: architecture/context-map.md
    op: append
timeout: 3600
retry:
  max: 2
  backoff: exponential
# M-A2: architecture design is a complex stage — plan, then self-check the
# produced design against acceptance criteria and retry if it falls short.
runtime: par
planning: required
max_reflect: 2
acceptance_criteria:
  - "接口设计覆盖需求文档中的所有功能点，无遗漏"
  - "数据模型定义完整，字段类型与约束明确"
  - "关键风险点已识别并给出缓解措施"
